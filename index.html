/* ---------- 乱数 ---------- */
let _seed = 1;
function srand(s){ _seed = s >>> 0; }
function rnd(){ _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 4294967296; }
function rndi(a,b){ return a + Math.floor(rnd() * (b - a + 1)); }
function rndiM(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }

/* ---------- サウンド ---------- */
let AC = null;
function audioInit(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==="suspended") AC.resume(); }
function beep(freq, dur, type, gain, slide){
  if(!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type||"square"; o.frequency.value = freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), AC.currentTime+dur);
  g.gain.value = gain||0.05;
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime+dur);
}
function noiseBoom(dur, gain){
  if(!AC) return;
  const len = AC.sampleRate * dur;
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const src = AC.createBufferSource(); src.buffer = buf;
  const g = AC.createGain(); g.gain.value = gain||0.12;
  const f = AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=900;
  src.connect(f); f.connect(g); g.connect(AC.destination); src.start();
}
let shootSndT = 0;

/* ---------- 入力 ---------- */

  const num = parseInt(e.key);

    return;
  }
  if(state === "shop"){
    if(num>=1 && num<=shopOffers.length) buyOffer(num-1);

    if(e.key==="w"||e.key==="W"||e.key==="Escape"||e.key==="Enter") closeShop();
    return;
  }
  if((e.key==="w"||e.key==="W") && (state==="play"||state==="boss")) openShop();
  if(e.key === "Enter") onEnter();
  if((e.key === "r" || e.key === "R") && state === "gameover") showCharSel();
});

function startWeaponLv(){ return 1 + (perkOn("wlv2")?1:0) + (perkOn("wlv3")?1:0); }

function gainPoints(n){
  const m = Math.ceil(n * (1 + 0.10*itemLv(3)));
  points += m; totalPoints += m;
  return m;
}

const FORM = [];
(function(){
  FORM.push([0,0]);
  for(let r=1; r<9; r++){
    const n = Math.min(3+r, 8);
    for(let i=0;i<n;i++){
      const ox = (i-(n-1)/2) * 17 + (r%2?4:-4);
      FORM.push([ox, r*14]);
    }

})();
function squadRadius(){ return 14 + Math.min(52, Math.sqrt(count)*7); }
function firepower(){ let s=0; for(const o of owned) s+=o.lv; return count * s; }

/* =====================================================================
   ステージ生成(ザコ増量・6種)
===================================================================== */
function stageLength(s){ return 2500 + s*450; }

function buildStage(s){
  srand(s*7919 + 13);
  events = [];
  stageLen = stageLength(s);
  let d = 350;
  const cpTargets = [stageLen*0.34, stageLen*0.67];
  let cpi = 0;
  while(d < stageLen - 350){
    if(cpi < cpTargets.length && d > cpTargets[cpi]){
      events.push({ d, type:"checkpoint" });
      cpi++; d += 300; continue;
    }
    const roll = rnd();
    if(roll < 0.30){
      const goodOps = [["+", rndi(5, 6+s*3)], ["x",2], (s>=3 && rnd()<0.25) ? ["x",3] : ["+", rndi(6, 8+s*2)]];
      const badOps  = [["-", rndi(3, 3+s*2)], ["/",2]];
      const g = goodOps[rndi(0,2)], b = badOps[rndi(0,1)];
      const goodLeft = rnd() < 0.5;
      events.push({ d, type:"gate", left: goodLeft?g:b, right: goodLeft?b:g });
      d += 280;
    }else{
      const kind = rnd();
      const wave = [];
      if(kind < 0.26){                       // 歩兵の大群
        const n = rndi(5, 7+Math.min(s,5));
        for(let i=0;i<n;i++) wave.push({ t:"inf", x: rndi(40, W-40), delay: rndi(0,70) });
      }else if(kind < 0.44){                 // ジグザグバイク隊
        const n = rndi(3, 5);
        for(let i=0;i<n;i++) wave.push({ t:"zig", x: rndi(90, W-90), delay: i*26 });
      }else if(kind < 0.58){                 // 射撃兵
        const n = rndi(2, 3);
        for(let i=0;i<n;i++) wave.push({ t:"shooter", x: rndi(70, W-70), delay: i*38 });
      }else if(kind < 0.72){                 // 横断ホバー
        const n = rndi(1, 2);
        for(let i=0;i<n;i++) wave.push({ t:"hover", side: rnd()<0.5?-1:1, y: rndi(130, 300), delay: i*60 });
      }else if(kind < 0.86){                 // スナイパー
        const n = rndi(1, 2);
        for(let i=0;i<n;i++) wave.push({ t:"sniper", x: rndi(80, W-80), delay: i*50 });
      }else{                                 // 戦車+護衛
        wave.push({ t:"tank", x: rndi(90, W-90), delay: 0 });
        wave.push({ t:"inf", x: rndi(40, W-40), delay: 25 });
        if(s>=3) wave.push({ t:"inf", x: rndi(40, W-40), delay: 45 });
      }
      events.push({ d, type:"wave", wave });
      d += rndi(110, 180);
    }
  }
  events.push({ d: stageLen, type:"boss" });
  events.sort((a,b)=>a.d-b.d);
}

/* =====================================================================
   開始・再開
===================================================================== */
function pickChar(i){
  chara = i;
  const c = CHARS[i];
  stage = 1; count = c.count + troopBonus(); points = 0;
  owned = [{id:c.weapon, lv:startWeaponLv()}];
  items = [];
  reviveUsed = false; invT = 0;
  awakened = false; specialT = 0;
  hiddenIdx = -1; hiddenDone = false;
  hospT = 600; droneT = 0;
  checkpoint = { stage:1, dist:0, count, owned: cloneOwned(owned), points:0, chara:i, hidden:-1 };
  enterStage(0);
}
function enterStage(fromDist){
  buildStage(stage);
  dist = fromDist;
  events = events.filter(e=>e.d > dist);
  bullets=[]; ebullets=[]; enemies=[]; gates=[]; cps=[]; parts=[]; banners=[]; floats=[]; slashes=[]; pillars=[]; allies=[]; meteors=[];
  boss = null; bossWarn = 0; flashWhite = 0;
  hiddenIdx = -1; hiddenSpawnT = 0;
  px = W/2; py = H-120;
  state = "play";
  hideOverlay();
  banner("STAGE " + stage + " / " + MAX_STAGE, "#d8c98f", 110);
}
function restartCheckpoint(){
  // ポイントと購入済み武器は引き継ぐ(位置・兵員のみ復元)
  stage = checkpoint.stage;
  count = checkpoint.count;
  chara = checkpoint.chara;
  awakened = owned.filter(o=>o.lv>=5).length >= 2;
  specialT = 0;
  if(checkpoint.hidden !== undefined && checkpoint.hidden >= 0){
    startHiddenRush(checkpoint.hidden);
    return;
  }
  enterStage(checkpoint.dist);
}
function nextStage(){
  if(stage >= MAX_STAGE){
    if(hiddenDone){ showEnding(); return; }
    startHiddenRush(0);
    return;
  }
  stage++;
  checkpoint = { stage, dist:0, count, owned: cloneOwned(owned), points, chara, hidden:-1 };
  enterStage(0);
}
/* 裏ボスラッシュ開始(idx=0..2) */
function startHiddenRush(idx){
  buildStage(MAX_STAGE);
  events = [];
  dist = stageLen;
  bullets=[]; ebullets=[]; enemies=[]; gates=[]; cps=[]; parts=[]; banners=[]; floats=[]; slashes=[]; pillars=[]; allies=[]; meteors=[];
  boss = null; bossWarn = 0; flashWhite = 0;
  px = W/2; py = H-120;
  hiddenIdx = idx;
  hiddenSpawnT = 120;
  state = "play";
  hideOverlay();
  checkpoint = { stage, dist, count, owned: cloneOwned(owned), points, chara, hidden: idx };
  banner("裏作戦 ― 深部掃討", "#ff5040", 130);
  banner("生物反応 … 異常値", "#d78aff", 130);
}
function spawnHiddenBoss(idx){

/* =====================================================================
   強化ショップ(ポイント制)
===================================================================== */
function costOf(c){
  if(c.kind==="new" || c.kind==="newI") return 250;
  if(c.kind==="up" || c.kind==="upI")  return [0,200,400,700,1200][c.to-1];
  if(c.kind==="troop") return 250;
  return 9999;
}
function genOffers(){
  const pool = [];
  if(slotCount() < MAX_SLOTS){
    for(let i=0;i<WEAPONS.length;i++){
      if(!owned.some(o=>o.id===i)) pool.push({ kind:"new", id:i });
    }
    for(let i=0;i<ITEMS.length;i++){
      if(!items.some(o=>o.id===i)) pool.push({ kind:"newI", id:i });
    }
  }
  for(const o of owned){
    if(o.lv < 5) pool.push({ kind:"up", id:o.id, to:o.lv+1 });
  }
  for(const o of items){
    if(o.lv < 5) pool.push({ kind:"upI", id:o.id, to:o.lv+1 });
  }
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  shopOffers = pool.slice(0,3);
  shopOffers.push({ kind:"troop" });   // 増援は常設
}
let shopRerolls = 3;
function openShop(){
  if(state!=="play" && state!=="boss") return;
  prevState = state;
  state = "shop";
  shopRerolls = 3;
  genOffers();
  renderShop();
}
function rerollOffers(){
  if(state!=="shop") return;
  if(shopRerolls<=0){ beep(140,0.12,"sawtooth",0.05,-50); return; }
  shopRerolls--;
  genOffers();
  renderShop();
  beep(460,0.06,"square",0.05); beep(620,0.06,"square",0.04);
}
function renderShop(){
  overlay.classList.remove("hidden");
  let cards = "";
  shopOffers.forEach((c,i)=>{
    const cost = costOf(c);
    const ok = points >= cost;
    if(c.kind==="troop"){
      cards += `
        <div class="card ${ok?"":"off"}" onclick="buyOffer(${i})">
          <div class="num">[ ${i+1} ]</div>
          <div class="chip" style="background:#8ab8ff;color:#8ab8ff;border-radius:50%"></div>
          <div class="wname">増援要請</div>
          <div class="tag troop">兵員 +8名</div>
          <div class="desc">部隊の頭数を直接補充する。</div>
          <div class="cost ${ok?"":"no"}">${cost} PT</div>
        </div>`;
      return;
    }
    if(c.kind==="newI" || c.kind==="upI"){
      const it = ITEMS[c.id];
      const to = c.kind==="newI" ? 1 : c.to;
      const tag = c.kind==="newI" ? `<div class="tag troop">アイテム追加</div>` : `<div class="tag up">Lv${c.to-1} → Lv${c.to}</div>`;
      cards += `
        <div class="card ${ok?"":"off"}" onclick="buyOffer(${i})">
          <div class="num">[ ${i+1} ]</div>
          <div class="chip" style="background:${it.col};color:${it.col};border-radius:50%"></div>
          <div class="wname">${it.name}</div>
          ${tag}
          <div class="stars">${"★".repeat(to)}</div>
          <div class="desc">${it.desc}<br>${it.eff(to)}</div>
          <div class="cost ${ok?"":"no"}">${cost} PT</div>
        </div>`;
      return;
    }
    const wp = WEAPONS[c.id];
    const isSp = c.kind==="up" && c.to===5;
    const tag = c.kind==="new" ? `<div class="tag new">新武器追加</div>`
      : isSp ? `<div class="tag sp">Lv5 スペシャル化</div>`
      : `<div class="tag up">Lv${c.to-1} → Lv${c.to}</div>`;
    const nm = isSp ? wp.special : wp.name;
    const dsc = isSp ? wp.spdesc : wp.desc;
    const stars = c.kind==="new" ? "★" : "★".repeat(c.to);
    cards += `
      <div class="card ${ok?"":"off"}" onclick="buyOffer(${i})">
        <div class="num">[ ${i+1} ]</div>
        <div class="chip" style="background:${wp.col};color:${wp.col}"></div>
        <div class="wname">${nm}</div>
        ${tag}
        <div class="stars">${stars}</div>
        <div class="desc">${dsc}</div>
        <div class="cost ${ok?"":"no"}">${cost} PT</div>
      </div>`;
  });
  overlay.innerHTML = `
    <div class="eyebrow">SUPPLY REQUISITION</div>
    <h1 style="font-size:24px">強化メニュー<small>UPGRADE</small></h1>
    <div class="pt">所持: ${points} PT / 総獲得: ${totalPoints} PT / 装備枠 ${slotCount()}/${MAX_SLOTS}</div>
    <div class="cards">${cards}</div>
    <div class="msg" style="font-size:12px">数字キーで購入(購入後は品揃え更新) / S 引き直し / W・Escで戻る</div>
    <button class="btn sub" onclick="rerollOffers()" ${shopRerolls<=0?"disabled":""}>品揃えを引き直す [S] (残り ${shopRerolls} 回)</button>
    <button class="btn sub" onclick="closeShop()">戦線に戻る (W)</button>`;
}
function buyOffer(i){
  const c = shopOffers[i];
  if(!c) return;
  const cost = costOf(c);
  if(points < cost){ beep(140,0.15,"sawtooth",0.06,-60); return; }
  points -= cost;
  if(c.kind==="new"){
    owned.push({ id:c.id, lv:1 });
    fireTs[c.id] = 0;
    banner("新武器: " + WEAPONS[c.id].name, "#7da453", 110);
  }else if(c.kind==="newI"){
    items.push({ id:c.id, lv:1 });
    banner("アイテム: " + ITEMS[c.id].name, "#8ab8ff", 110);
  }else if(c.kind==="upI"){
    const o = items.find(o=>o.id===c.id);
    o.lv = c.to;
    banner(ITEMS[c.id].name + " Lv" + c.to + " (" + ITEMS[c.id].eff(c.to) + ")", "#8ab8ff", 100);
  }else if(c.kind==="up"){
    const o = owned.find(o=>o.id===c.id);
    o.lv = c.to;
    if(c.to===5){ banner("スペシャル武器: " + WEAPONS[c.id].special + "!", "#ff8ab0", 150); flashWhite = 12; }
    else banner(WEAPONS[c.id].name + " Lv" + c.to, "#e8a33d", 90);
    checkAwaken();
  }else{
    count = Math.min(999, count + 8);
    banner("増援 +8名", "#8ab8ff", 90);
  }
  beep(520,0.08,"square",0.06); setTimeout(()=>beep(780,0.08,"square",0.06),80);
  genOffers();
  renderShop();
}
function closeShop(){
  hideOverlay();
  saveGame();
  state = prevState;
}

function spawnWave(wave){
  for(const u of wave){
    if(u.t === "inf")     enemies.push({ t:"inf",     x:u.x, y:-20-u.delay, hp:ehp("inf"),     spd:1.5+stage*0.12, r:11, power:2, ft:0 });
    if(u.t === "zig")     enemies.push({ t:"zig",     x:u.x, bx:u.x, y:-20-u.delay, hp:ehp("zig"), spd:3.1, r:10, power:2, ph:Math.random()*6.28 });
    if(u.t === "shooter") enemies.push({ t:"shooter", x:u.x, y:-26-u.delay, hp:ehp("shooter"), spd:0.8, r:13, power:3, ft: rndiM(30,80) });
    if(u.t === "hover")   enemies.push({ t:"hover",   x:(u.side<0?-25:W+25), y:u.y+(u.delay||0), vx:(u.side<0?2.3:-2.3), hp:ehp("hover"), r:12, power:2, ft: rndiM(35,70), ph:Math.random()*6.28 });
    if(u.t === "sniper")  enemies.push({ t:"sniper",  x:u.x, y:-30-(u.delay||0), hp:ehp("sniper"), spd:1.2, r:13, power:3, st:"in", at:0, aimA:Math.PI/2 });
    if(u.t === "tank")    enemies.push({ t:"tank",    x:u.x, y:-40, hp:ehp("tank"), spd:0.55, r:22, power:6, ft: 60 });
  }
}

/* =====================================================================
   演出・撃破処理
===================================================================== */
function banner(text, color, life){ banners.push({ text, color: color||"#e8a33d", life: life||90, max: life||90 }); }
function addFloat(x,y,txt,col){ floats.push({ x, y, txt, col:col||"#ffd76a", life:46 }); }
function boom(x,y,n,col,big){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = Math.random()*(big?5.5:3)+1;
    parts.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life: rndiM(18,big?48:30), col: col||"#e8a33d", sz: Math.random()*(big?6:3)+1.5 });
  }
}
/* 敵撃破(ポイント付与) */
function destroyEnemy(idx, giveP){
  const e = enemies[idx];
  if(!e) return;
  boom(e.x, e.y, e.t==="tank"?26:12, "#e8a33d", e.t==="tank");
  if(e.t==="tank") noiseBoom(0.3,0.1); else beep(220,0.08,"sawtooth",0.04,-120);
  if(giveP){
    const p = gainPoints(epts(e.t));
    addFloat(e.x, e.y, "+"+p);
  }
  enemies.splice(idx,1);
}
function checkAwaken(){
  if(awakened) return;
  const n = owned.filter(o=>o.lv>=5).length;
  if(n >= 2){
    awakened = true;
    specialT = 60;
    flashWhite = 14; shake = 10;
    banner("★ 指揮官覚醒 ★", "#ffd76a", 160);
    banner(CHARS[chara].name + "、真の力を解放!", "#ff8ab0", 160);
    banner("固有スペシャル武器 起動", "#6ef0ff", 160);
    noiseBoom(0.5, 0.15);
    beep(523,0.15,"square",0.07); setTimeout(()=>beep(784,0.15,"square",0.07),140); setTimeout(()=>beep(1046,0.3,"square",0.08),280);
  }
}
function loseSoldiers(n, x, y){
  if(state!=="play" && state!=="boss") return;
  if(invT > 0) return;   // 復活直後の無敵
  if(itemLv(2) > 0 && Math.random() < 0.11*itemLv(2)){
    addFloat(px, py-56, "GUARD!", "#7ec8ff");
    parts.push({x:px,y:py-10,vx:0,vy:0,life:10,col:"#7ec8ff",sz:8,ring:true,maxr:squadRadius()+14});
    beep(880,0.06,"square",0.04);
    return;
  }
  count -= n;
  boom(x||px, y||py, 10, "#c0392b");
  shake = Math.max(shake, 7);
  beep(160,0.15,"sawtooth",0.07,-80);
  if(count <= 0){
    // 復活の勲章
    if(perkOn("revive") && !reviveUsed){
      reviveUsed = true;
      count = 15 + troopBonus();
      invT = 130;
      ebullets = [];
      boom(px, py, 60, "#ffd76a", true);
      banner("★ 復活の勲章 発動!", "#ffd76a", 130);
      banner("一時無敵 ― 立て直せ!", "#d8c98f", 130);
      noiseBoom(0.4, 0.15);
      flashWhite = 12;
      beep(660,0.15,"square",0.07); setTimeout(()=>beep(990,0.25,"square",0.07),150);
      return;
    }
    count = 0;
    boom(px,py,44,"#c0392b",true);
    noiseBoom(0.6,0.18);
    saveGame();
    showGameOver();
  }
}

/* =====================================================================
   射撃
===================================================================== */
function bulletSize(dmg){ return Math.min(9, 2 + Math.log2(1+dmg)*1.1); }

function fireAll(){
  for(let k=0; k<owned.length; k++){
    const o = owned[k];
    const wp = WEAPONS[o.id];
    if(wp.type === "orb" || wp.type === "drone") continue;   // 常時稼働系
    fireTs[o.id]--;
    if(fireTs[o.id] > 0) continue;
    const p = wparam(o);
    fireTs[o.id] = Math.max(3, Math.round(p.rate * (1 - 0.06*itemLv(1))));

    /* --- 戦車招集 --- */
    if(wp.type === "tank"){
      allies.push({ x:px, y:py-44, vy:-2.4, dmg: count*p.dmg*0.5, ft:16, big: !!p.big, r: p.big?32:18 });
      banner(p.big ? "超重戦車マンモス 出撃!" : "友軍戦車 出撃", "#a8c86a", 45);
      beep(120,0.25,"sawtooth",0.08,60);
      continue;
    }
    /* --- メテオコール --- */
    if(wp.type === "meteor"){
      const targets = [];
      if(boss && boss.y>-40) targets.push({x:boss.x, y:boss.y});
      const pool2 = enemies.slice();
      while(targets.length < p.n && pool2.length){
        const e = pool2.splice(Math.floor(Math.random()*pool2.length),1)[0];
        targets.push({x:e.x, y:e.y+30});
      }
      while(targets.length < p.n) targets.push({x: 60+Math.random()*(W-120), y: 120+Math.random()*260});
      for(const tg of targets) meteors.push({ tx:tg.x, ty:tg.y, t:0, blast:p.blast, dmg: count*p.dmg });
      banner(o.lv>=5 ? "アルマゲドン!" : "メテオ 着弾予測", "#ff9a5e", 45);
      beep(200,0.3,"sawtooth",0.06,-120);
      continue;
    }

    /* --- 近接斬撃 --- */
    if(wp.type === "melee"){
      slashDir *= -1;
      const dmg = p.dmg * count;
      slashes.push({ x:px, y:py-8, r:p.range, dir:slashDir, t:0 });
      // 範囲ダメージ(前方)
      if(boss && boss.y>-40 && boss.alpha>0.35){
        const dx=boss.x-px, dy=boss.y-(py-8);
        if(dy < 30 && dx*dx+dy*dy < (p.range+boss.r)*(p.range+boss.r)){
          boss.hp -= dmg; boss.flash=4;
          if(boss.hp<=0) killBoss();
        }
      }
      for(let j=enemies.length-1;j>=0;j--){
        const e = enemies[j];
        const dx=e.x-px, dy=e.y-(py-8);
        if(dy < 30 && dx*dx+dy*dy < (p.range+e.r)*(p.range+e.r)){
          e.hp -= dmg;
          e.y -= 12;   // ノックバック
          parts.push({x:e.x,y:e.y,vx:(Math.random()-.5)*3,vy:-1,life:8,col:"#ff8ab0",sz:3});
          if(e.hp<=0) destroyEnemy(j, true);
        }
      }
      // 敵弾を斬る
      for(let j=ebullets.length-1;j>=0;j--){
        const b = ebullets[j];
        const dx=b.x-px, dy=b.y-(py-8);
        if(dy < 30 && dx*dx+dy*dy < p.range*p.range){
          parts.push({x:b.x,y:b.y,vx:0,vy:0,life:8,col:"#ff8ab0",sz:4});
          ebullets.splice(j,1);
        }
      }
      // Lv5: 斬撃波
      if(p.wave){
        bullets.push({
          x:px, y:py-30, vx:0, vy:-9,
          dmg: count * 3.2, col:"#ff8ab0", type:"wave",
          sz: 30, life: 90, pierce: 999, blast:0
        });
      }
      beep(900,0.07,"sawtooth",0.05,-500);
      shake = Math.max(shake, 2.5);
      continue;
    }

    /* --- 射撃武器 --- */
    let streams = Math.min(10, Math.max(1, Math.ceil(Math.sqrt(count)*0.9)));
    if(wp.type==="rocket"||wp.type==="plasma") streams = Math.min(3, Math.max(1, Math.floor(count/25)+1));
    if(wp.type==="flak") streams = Math.min(2, Math.max(1, Math.floor(count/40)+1));
    if(wp.type==="homing") streams = 1;
    const per = (count * p.dmg) / (streams * p.pellets);
    const src = droneXY(k);
    for(let s=0; s<streams; s++){
      const ox = (s-(streams-1)/2) * 12;
      for(let pp=0; pp<p.pellets; pp++){
        if(bullets.length >= 750) break;
        let a = -Math.PI/2;
        a += (p.pellets>1 ? (pp-(p.pellets-1)/2)*p.spread : 0);
        a += (Math.random()-0.5)*p.spread;
        const bx = (k===0 ? px+ox : src.x + ox*0.4);
        const by = (k===0 ? py-16 : src.y - 8);
        bullets.push({
          x:bx, y:by,
          vx:Math.cos(a)*p.speed, vy:Math.sin(a)*p.speed,
          dmg:per, col:wp.col, type:wp.type, blast:p.blast||0,
          pierce: p.pierce||0, lvl:o.lv, wid:o.id,
          fuse: p.fuse||0, frag: p.frag||0,
          flame: p.flame, giga: p.giga, suck: p.suck,
          sz: bulletSize(per) * (wp.type==="plasma"?(1.6+o.lv*0.5): wp.type==="rocket"?1.6: wp.type==="flak"?1.4: p.giga?1.6:1),
          life: (o.id===1 ? 46+o.lv*4 : 240)   // ショットガンは射程限界あり
        });
      }
      // 武器ごとのマズル演出
      if(o.id===0){
        // ライフル: 薬莢排出
        parts.push({ x:(k===0?px+ox:src.x)+4, y:(k===0?py-14:src.y-6), vx:1.5+Math.random(), vy:-1.2, life:14, col:"#d8b45a", sz:2.2 });
      }else if(o.id===1){
        // ショットガン: マズルフラッシュ(火花の扇)
        for(let m=0;m<4;m++){
          const ma = -Math.PI/2 + (Math.random()-0.5)*0.9;
          parts.push({ x:(k===0?px+ox:src.x), y:(k===0?py-18:src.y-10), vx:Math.cos(ma)*3.5, vy:Math.sin(ma)*3.5, life:7, col: Math.random()<0.5?"#ffb14a":"#fff2c0", sz:3 });
        }
      }
      parts.push({ x:(k===0?px+ox:src.x), y:(k===0?py-18:src.y-10), vx:(Math.random()-.5), vy:-1.5, life:5, col:"#fff2c0", sz:3 });
    }
    if(frame - shootSndT > 4){
      shootSndT = frame;
      const f = wp.type==="plasma"?170: wp.type==="rocket"?240: wp.type==="laser"?1200: wp.type==="homing"?520: 700+Math.random()*250;
      beep(f, 0.05, wp.type==="laser"?"sawtooth":"square", 0.016, -300);
    }
  }
}

function droneXY(k){
  if(k===0) return { x:px, y:py-10 };
  const list = owned.filter((o,i)=>i>0 && WEAPONS[o.id].type!=="orb");
  const idx = list.indexOf(owned[k]);
  if(idx < 0) return { x:px, y:py-10 };
  const n = Math.max(1, list.length);
  const a = frame*0.03 + idx*(Math.PI*2/n);
  const r = squadRadius() + 26;
  return { x: px + Math.cos(a)*r, y: py + Math.sin(a)*r*0.55 - 8 };
}

function orbList(off){
  const o2 = off||0;
  const res = [];
  for(const o of owned){
    if(WEAPONS[o.id].type !== "orb") continue;
    const p = wparam(o);
    const R = squadRadius() + 36;
    for(let i=0;i<p.orbs;i++){
      const a = (frame-o2)*p.ospd + i*Math.PI*2/p.orbs;
      res.push({ x: px+Math.cos(a)*R, y: py+Math.sin(a)*R*0.8, r: p.orbR, dmg: p.dmg*count, lv:o.lv });
    }
  }
  return res;
}

function explode(x, y, radius, dmg){
  boom(x, y, 22, "#ff9a4a", true);
  parts.push({ x, y, vx:0, vy:0, life:12, col:"#fff", sz:radius*0.5, ring:true, maxr:radius });
  shake = Math.max(shake, 6);
  noiseBoom(0.15, 0.06);
  if(boss && boss.y > -40){
    const dx=x-boss.x, dy=y-boss.y;
    if(dx*dx+dy*dy < (radius+boss.r)*(radius+boss.r)){ boss.hp -= dmg; boss.flash=4; if(boss.hp<=0) killBoss(); }
  }
  for(let j=enemies.length-1;j>=0;j--){
    const e = enemies[j];
    const dx=x-e.x, dy=y-e.y;
    if(dx*dx+dy*dy < (radius+e.r)*(radius+e.r)){
      e.hp -= dmg;
      if(e.hp<=0) destroyEnemy(j, true);
    }
  }
}

function burstFlak(b){
  explode(b.x, b.y, b.blast, b.dmg);
  for(let k=0;k<b.frag;k++){
    if(bullets.length >= 750) break;
    const a = Math.random()*Math.PI*2;
    bullets.push({ x:b.x, y:b.y, vx:Math.cos(a)*6, vy:Math.sin(a)*6, dmg:b.dmg*0.15,
      col:"#e8ff5e", type:"bullet", sz:2.5, life:26, pierce:0, blast:0, wid:9 });
  }
}

/* =====================================================================
   更新
===================================================================== */
function update(){
  frame++;
  if(state!=="play" && state!=="boss") return;

  const spd = CHARS[chara].spd * (1 + 0.10*itemLv(0));
  if(keys["ArrowLeft"])  px -= spd;
  if(keys["ArrowRight"]) px += spd;
  if(keys["ArrowUp"])    py -= spd;
  if(keys["ArrowDown"])  py += spd;
  px = Math.max(26, Math.min(W-26, px));
  py = Math.max(H*0.5, Math.min(H-50, py));

  /* --- 野戦病院: 自動増員 --- */
  if(itemLv(4) > 0 && count > 0){
    hospT--;
    if(hospT <= 0){
      hospT = Math.max(150, 600 - itemLv(4)*90);
      count = Math.min(999, count + 1);
      addFloat(px, py-56, "+1名", "#7da453");
    }
  }

  /* --- アタックドローン(常時稼働) --- */
  const dro = owned.find(o=>WEAPONS[o.id].type==="drone");
  if(dro && count > 0){
    const dp = wparam(dro);
    droneT--;
    if(droneT <= 0){
      droneT = Math.max(4, Math.round(dp.rate * (1 - 0.06*itemLv(1))));
      let tx=null, ty=null, best=1e9;
      if(boss && boss.y>-40 && boss.alpha>0.35){ tx=boss.x; ty=boss.y; }
      else for(const e of enemies){
        const d2=(e.x-px)**2+(e.y-py)**2;
        if(d2<best){ best=d2; tx=e.x; ty=e.y; }
      }
      if(tx !== null){
        const per = count * dp.dmg;
        for(let i2=0;i2<dp.n;i2++){
          if(bullets.length >= 750) break;
          const dx2 = px + (i2-(dp.n-1)/2)*26;
          const dy2 = py - 58 + Math.sin(frame*0.1+i2)*4;
          const a = Math.atan2(ty-dy2, tx-dx2);
          bullets.push({ x:dx2, y:dy2, vx:Math.cos(a)*10, vy:Math.sin(a)*10, dmg:per, col:"#5ee8c8",
            type: dro.lv>=5 ? "laser" : "bullet", sz:2.6, life:120, pierce:0, blast:0, wid:8 });
        }
        beep(980,0.04,"square",0.014,-400);
      }
    }
  }

  const scrollSpd = 2.4;
  scroll += scrollSpd;

  if(state === "play"){
    dist += scrollSpd;
    while(events.length && events[0].d <= dist){
      const ev = events.shift();
      if(ev.type === "gate") spawnGate(ev);
      else if(ev.type === "wave") spawnWave(ev.wave);
      else if(ev.type === "checkpoint") cps.push({ y:-40, done:false });
      else if(ev.type === "boss") spawnBoss();
    }
  }

  if(keys[" "] && count > 0) fireAll();
  else for(const o of owned) if(fireTs[o.id]>0) fireTs[o.id]--;

  /* --- 覚醒: 固有スペシャル武器(自動発動) --- */
  if(awakened && count > 0){
    specialT--;
    if(specialT <= 0){
      if(chara === 0){
        /* ストライカー: オービタルストライク */
        specialT = 110;
        const targets = [];
        if(boss && boss.y > -40) targets.push(boss.x);
        const pool = enemies.slice();
        while(targets.length < 3 && pool.length){
          const e = pool.splice(Math.floor(Math.random()*pool.length),1)[0];
          targets.push(e.x);
        }
        if(targets.length === 0) targets.push(px);
        for(const tx of targets) pillars.push({ x: tx, t: 0 });
        banner("オービタルストライク!", CHARS[0].col, 45);
        beep(1500,0.3,"sawtooth",0.05,-1200);
      }else if(chara === 1){
        /* ミサイリア: フルバースト */
        specialT = 95;
        for(let k=0;k<10;k++){
          const a = -Math.PI/2 + (k-4.5)*0.30;
          bullets.push({ x:px, y:py-14, vx:Math.cos(a)*5, vy:Math.sin(a)*5,
            dmg: count*1.3, col:"#c8ff8e", type:"homing", blast:66,
            pierce:0, wid:4, sz:6, life:260 });
        }
        banner("フルバースト!", CHARS[1].col, 45);
        beep(600,0.2,"square",0.06,-300);
      }else{
        /* ブレイド: 幻影剣舞(全周斬撃+斬撃波8方向) */
        specialT = 85;
        slashes.push({ x:px, y:py, r:250, dir:1, t:0, full:true });
        const dmg = count*4;
        for(let j=enemies.length-1;j>=0;j--){
          const e = enemies[j];
          const dx=e.x-px, dy=e.y-py;
          if(dx*dx+dy*dy < 260*260){ e.hp-=dmg; e.y-=16; if(e.hp<=0) destroyEnemy(j,true); }
        }
        if(boss && boss.y>-40){
          const dx=boss.x-px, dy=boss.y-py;
          if(dx*dx+dy*dy < (260+boss.r)*(260+boss.r)){ boss.hp-=dmg; boss.flash=4; if(boss.hp<=0) killBoss(); }
        }
        for(let j=ebullets.length-1;j>=0;j--){
          const b2 = ebullets[j];
          const dx=b2.x-px, dy=b2.y-py;
          if(dx*dx+dy*dy < 260*260) ebullets.splice(j,1);
        }
        for(let k=0;k<8;k++){
          const a = k/8*Math.PI*2;
          bullets.push({ x:px, y:py, vx:Math.cos(a)*7, vy:Math.sin(a)*7,
            dmg: count*1.6, col:"#ff8ab0", type:"wave", sz:24, life:70, pierce:999, blast:0 });
        }
        banner("幻影剣舞!", CHARS[2].col, 45);
        beep(1100,0.15,"sawtooth",0.06,-700);
        shake = Math.max(shake, 6);
      }
    }
  }

  /* --- オービタル光柱 --- */
  for(let i=pillars.length-1;i>=0;i--){
    const pl = pillars[i];
    pl.t++;
    if(pl.t === 22){
      const dmg = count*7;
      for(let j=enemies.length-1;j>=0;j--){
        if(Math.abs(enemies[j].x - pl.x) < 36){ enemies[j].hp -= dmg; if(enemies[j].hp<=0) destroyEnemy(j,true); }
      }
      if(boss && boss.y>-40 && Math.abs(boss.x - pl.x) < boss.r+30){ boss.hp -= dmg; boss.flash=5; if(boss.hp<=0) killBoss(); }
      boom(pl.x, 180+Math.random()*260, 24, "#ffd76a", true);
      noiseBoom(0.2, 0.09);
      shake = Math.max(shake, 8);
    }
    if(pl.t > 36) pillars.splice(i,1);
  }

  /* --- オービットスフィア --- */
  const orbs = orbList();
  for(const ob of orbs){
    for(let i=ebullets.length-1;i>=0;i--){
      const b = ebullets[i];
      const dx=b.x-ob.x, dy=b.y-ob.y;
      if(dx*dx+dy*dy < (ob.r+5)*(ob.r+5)){
        parts.push({x:b.x,y:b.y,vx:0,vy:0,life:8,col:"#7ec8ff",sz:4});
        ebullets.splice(i,1);
      }
    }
    for(let j=enemies.length-1;j>=0;j--){
      const e = enemies[j];
      const dx=e.x-ob.x, dy=e.y-ob.y;
      if(dx*dx+dy*dy < (ob.r+e.r)*(ob.r+e.r)){
        e.hp -= ob.dmg;
        if(frame%5===0) parts.push({x:e.x,y:e.y,vx:(Math.random()-.5)*2,vy:-1,life:7,col:"#7ec8ff",sz:2.5});
        if(e.hp<=0) destroyEnemy(j, true);
      }
    }
    if(boss && boss.y>-40 && boss.alpha>0.35){
      const dx=boss.x-ob.x, dy=boss.y-ob.y;
      if(dx*dx+dy*dy < (ob.r+boss.r)*(ob.r+boss.r)){
        boss.hp -= ob.dmg;
        if(frame%6===0){ boss.flash=2; parts.push({x:ob.x,y:ob.y,vx:0,vy:-1,life:7,col:"#7ec8ff",sz:3}); }
        if(boss.hp<=0) killBoss();
      }
    }
  }

  /* --- 斬撃エフェクト --- */
  for(let i=slashes.length-1;i>=0;i--){
    slashes[i].t++;
    if(slashes[i].t>9) slashes.splice(i,1);
  }

  /* --- 自軍弾 --- */
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    if(b.type==="homing"){
      let tx=null, ty=null, best=1e9;
      if(boss && boss.y>-40){ tx=boss.x; ty=boss.y; best=(boss.x-b.x)**2+(boss.y-b.y)**2; }
      for(const e of enemies){
        const d2=(e.x-b.x)**2+(e.y-b.y)**2;
        if(d2<best){ best=d2; tx=e.x; ty=e.y; }
      }
      if(tx!==null){
        const want = Math.atan2(ty-b.y, tx-b.x);
        const cur = Math.atan2(b.vy, b.vx);
        let diff = want-cur;
        while(diff>Math.PI) diff-=Math.PI*2;
        while(diff<-Math.PI) diff+=Math.PI*2;
        const na = cur + Math.max(-0.13, Math.min(0.13, diff));
        const sp = Math.hypot(b.vx,b.vy)*1.02;
        b.vx = Math.cos(na)*Math.min(sp,10); b.vy = Math.sin(na)*Math.min(sp,10);
      }
      parts.push({x:b.x,y:b.y,vx:0,vy:1,life:8,col:"rgba(157,255,94,0.6)",sz:2.5});
    }
    if(b.type==="rocket" && parts.length<650){
      // 黒煙とオレンジ炎の交互トレイル
      const smoke = Math.random()<0.55;
      parts.push({x:b.x+(Math.random()-.5)*3, y:b.y+6, vx:(Math.random()-.5)*0.8, vy:1.4,
        life: smoke?16:7, col: smoke?"rgba(90,85,80,0.55)":"rgba(255,170,80,0.8)", sz: smoke?4.5:3});
    }
    if(b.suck){
      // ブラックホール砲: 周囲の敵弾を吸い込む
      for(let j=ebullets.length-1;j>=0;j--){
        const eb = ebullets[j];
        const dx=eb.x-b.x, dy=eb.y-b.y;
        const d2 = dx*dx+dy*dy;
        if(d2 < 90*90){
          eb.x -= dx*0.15; eb.y -= dy*0.15;
          if(d2 < b.sz*b.sz*2){ parts.push({x:eb.x,y:eb.y,vx:0,vy:0,life:8,col:"#d78aff",sz:3}); ebullets.splice(j,1); }
        }
      }
    }
    if(b.type==="flak"){
      b.fuse--;
      parts.length<650 && frame%2===0 && parts.push({x:b.x,y:b.y+4,vx:0,vy:0.8,life:6,col:"rgba(232,255,94,0.5)",sz:2});
      if(b.fuse <= 0){ burstFlak(b); bullets.splice(i,1); continue; }
    }
    b.x += b.vx; b.y += b.vy; b.life--;
    if(b.life<=0 || b.y < -40 || b.y > H+30 || b.x<-20 || b.x>W+20){ bullets.splice(i,1); continue; }

    let consumed = false;
    if(boss && boss.y > -40 && boss.alpha > 0.35){
      const dx=b.x-boss.x, dy=b.y-boss.y;
      const hitR = boss.r + (b.type==="wave"? b.sz : 0);
      if(dx*dx+dy*dy < hitR*hitR){
        boss.hp -= b.dmg; boss.flash = 3;
        parts.push({x:b.x,y:b.y,vx:(Math.random()-.5)*2,vy:-1,life:8,col:b.col,sz:2.5});
        if(boss.hp <= 0){ killBoss(); }
        if(b.type==="rocket"||b.type==="homing"){ explode(b.x,b.y,b.blast,b.dmg*0.6); consumed=true; }
        else if(b.type==="flak"){ burstFlak(b); consumed=true; }
        else if(b.type!=="laser" && b.type!=="plasma" && b.type!=="wave") consumed = true;
      }
    }
    if(!consumed) for(let j=enemies.length-1;j>=0;j--){
      const e = enemies[j];
      const dx=b.x-e.x, dy=b.y-e.y;
      if(dx*dx+dy*dy < (e.r+b.sz)*(e.r+b.sz)){
        e.hp -= b.dmg;
        parts.push({x:b.x,y:b.y,vx:(Math.random()-.5)*2,vy:-1,life:6,col:b.col,sz:2});
        if(e.hp <= 0) destroyEnemy(j, true);
        if(b.type==="rocket"||b.type==="homing"){ explode(b.x,b.y,b.blast,b.dmg*0.6); consumed=true; }
        else if(b.type==="flak"){ burstFlak(b); consumed=true; }
        else if(b.type==="laser"||b.type==="plasma"||b.type==="wave"){ /* 貫通 */ }
        else if(b.pierce>0){ b.pierce--; }
        else consumed = true;
        break;
      }
    }
    if(consumed) bullets.splice(i,1);
  }

  /* --- ゲート --- */
  for(let i=gates.length-1;i>=0;i--){
    const g = gates[i];
    g.y += scrollSpd;
    if(!g.used && g.y + g.h > py - 6 && g.y < py + 6){
      if(px > g.x && px < g.x + g.w){
        g.used = true;
        applyGate(g.op);
        for(const g2 of gates) if(g2 !== g && Math.abs(g2.y - g.y) < 5) g2.used = true;
      }
    }
    if(g.y > H + 20) gates.splice(i,1);
  }

  /* --- チェックポイント --- */
  for(let i=cps.length-1;i>=0;i--){
    const c = cps[i];
    c.y += scrollSpd;
    if(!c.done && c.y >= py){
      c.done = true;
      checkpoint = { stage, dist, count, owned: cloneOwned(owned), points, chara, hidden:-1 };
      banner("✚ チェックポイント確保", "#7da453", 90);
      beep(660,0.1,"square",0.06); setTimeout(()=>beep(880,0.15,"square",0.06),110);
      openShop();
    }
    if(c.y > H+40) cps.splice(i,1);
  }
  if(state === "shop") return;

  /* --- 裏ボスの出現待ち --- */
  if(hiddenIdx >= 0 && !boss && state === "play" && hiddenSpawnT > 0){
    hiddenSpawnT--;
    if(hiddenSpawnT === 0) spawnHiddenBoss(hiddenIdx);
  }

  /* --- 敵 --- */
  const sqR = squadRadius();
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];

    if(e.t==="inf"){
      e.y += e.spd + scrollSpd*0.4;
      if(e.y > 80) e.x += (px - e.x) * 0.008;
    }
    else if(e.t==="zig"){
      e.y += e.spd + scrollSpd*0.3;
      e.x = e.bx + Math.sin(e.y*0.035 + e.ph) * 85;
      e.x = Math.max(15, Math.min(W-15, e.x));
    }
    else if(e.t==="shooter"){
      e.y += e.spd + scrollSpd*0.25;
      e.ft--;
      if(e.ft <= 0 && e.y > 0 && e.y < H-160){
        const a = Math.atan2(py - e.y, px - e.x);
        ebullets.push({ x:e.x, y:e.y, vx:Math.cos(a)*3.4, vy:Math.sin(a)*3.4 });
        e.ft = Math.max(38, 95 - stage*6);
        beep(300,0.06,"square",0.03,-150);
      }
    }
    else if(e.t==="hover"){
      e.x += e.vx;
      e.y += Math.sin(frame*0.05 + e.ph) * 0.9 + scrollSpd*0.05;
      e.ft--;
      if(e.ft <= 0 && e.x > 20 && e.x < W-20){
        const a = Math.atan2(py - e.y, px - e.x);
        ebullets.push({ x:e.x, y:e.y+8, vx:Math.cos(a)*3.0, vy:Math.sin(a)*3.0 });
        e.ft = Math.max(45, 85 - stage*5);
        beep(360,0.05,"square",0.03,-150);
      }
      if((e.vx>0 && e.x>W+40)||(e.vx<0 && e.x<-40)){ enemies.splice(i,1); continue; }
    }
    else if(e.t==="sniper"){
      if(e.st==="in"){
        e.y += e.spd + scrollSpd*0.3;
        if(e.y >= 80){ e.st="cycle"; e.at=0; }
      }else{
        e.y += scrollSpd*0.06;   // ほぼ静止
        e.at++;
        if(e.at < 42){
          if(e.at < 30) e.aimA = Math.atan2(py-e.y, px-e.x);  // 30fまで追尾→ロック
        }else if(e.at === 42){
          ebullets.push({ x:e.x, y:e.y, vx:Math.cos(e.aimA)*8, vy:Math.sin(e.aimA)*8, big:true });
          beep(1200,0.1,"sawtooth",0.05,-800);
        }else if(e.at > 95){
          e.at = 0;
        }
      }
    }
    else if(e.t==="tank"){
      e.y += e.spd + scrollSpd*0.25;
      e.ft--;
      if(e.ft <= 0 && e.y > 0 && e.y < H-160){
        const a = Math.atan2(py - e.y, px - e.x);
        for(let k=-1;k<=1;k++) ebullets.push({ x:e.x, y:e.y+10, vx:Math.cos(a+k*0.22)*3, vy:Math.sin(a+k*0.22)*3 });
        e.ft = Math.max(65, 130 - stage*8);
        beep(300,0.06,"square",0.03,-150);
      }
    }

    const dx=e.x-px, dy=e.y-py;
    if(dx*dx+dy*dy < (sqR+e.r)*(sqR+e.r)*0.55){
      boom(e.x,e.y,16,"#e8a33d", e.t==="tank");
      loseSoldiers(e.power, e.x, e.y);
      enemies.splice(i,1);
      continue;
    }
    if(e.y > H+40){ enemies.splice(i,1); }
  }

  /* --- 友軍戦車 --- */
  for(let i=allies.length-1;i>=0;i--){
    const al = allies[i];
    al.y += al.vy;
    al.ft--;
    if(al.ft <= 0){
      al.ft = al.big ? 10 : 16;
      if(bullets.length < 750)
        bullets.push({ x:al.x, y:al.y-24, vx:0, vy:-9, dmg:al.dmg, col:"#c8e08a", type:"bullet", sz:3.5, life:120, pierce: al.big?2:0, blast:0, wid:10 });
      parts.push({x:al.x,y:al.y-26,vx:0,vy:-1,life:5,col:"#fff2c0",sz:3});
    }
    for(let j=enemies.length-1;j>=0;j--){
      const e = enemies[j];
      const dx=e.x-al.x, dy=e.y-al.y;
      if(dx*dx+dy*dy < (al.r+e.r)*(al.r+e.r)){
        e.hp -= al.dmg*0.12;
        if(frame%6===0) parts.push({x:e.x,y:e.y,vx:0,vy:-1,life:6,col:"#a8c86a",sz:2.5});
        if(e.hp<=0) destroyEnemy(j, true);
      }
    }
    if(boss && boss.y>-40){
      const dx=boss.x-al.x, dy=boss.y-al.y;
      if(dx*dx+dy*dy < (al.r+boss.r)*(al.r+boss.r)){
        boss.hp -= al.dmg*0.12;
        if(frame%6===0) boss.flash=2;
        if(boss.hp<=0) killBoss();
      }
    }
    if(al.y < -70) allies.splice(i,1);
  }

  /* --- 隕石 --- */
  for(let i=meteors.length-1;i>=0;i--){
    const m = meteors[i];
    m.t++;
    if(m.t === 44){
      explode(m.tx, m.ty, m.blast, m.dmg);
      shake = Math.max(shake, 10);
    }
    if(m.t > 44) meteors.splice(i,1);
  }

  /* --- ボス --- */
  if(boss) bossAct();
  if(bossWarn>0) bossWarn--;

  /* --- 敵弾 --- */
  for(let i=ebullets.length-1;i>=0;i--){
    const b = ebullets[i];
    if(b.homing){
      const want = Math.atan2(py-b.y, px-b.x);
      const cur = Math.atan2(b.vy,b.vx);
      let diff = want-cur;
      while(diff>Math.PI) diff-=Math.PI*2;
      while(diff<-Math.PI) diff+=Math.PI*2;
      const na = cur + Math.max(-0.045, Math.min(0.045, diff));
      const sp = Math.hypot(b.vx,b.vy);
      b.vx=Math.cos(na)*sp; b.vy=Math.sin(na)*sp;
      b.hlife--;
      if(b.hlife<=0) b.homing=false;
      parts.push({x:b.x,y:b.y,vx:0,vy:-0.5,life:5,col:"rgba(255,120,80,0.5)",sz:2});
    }
    if(b.bomb !== undefined){
      b.vy += 0.06;
      b.bomb--;
      if(b.bomb<=0){
        for(let k=0;k<10;k++){
          const a = k/10*Math.PI*2;
          ebullets.push({ x:b.x, y:b.y, vx:Math.cos(a)*2.4, vy:Math.sin(a)*2.4 });
        }
        boom(b.x,b.y,18,"#ff6b4a",true);
        noiseBoom(0.15,0.07);
        ebullets.splice(i,1);
        continue;
      }
    }
    b.x += b.vx; b.y += b.vy;
    if(b.y > H+15 || b.y < -60 || b.x < -35 || b.x > W+35){ ebullets.splice(i,1); continue; }
    const dx=b.x-px, dy=b.y-py;
    if(dx*dx+dy*dy < sqR*sqR*0.6){
      ebullets.splice(i,1);
      loseSoldiers(1, b.x, b.y);
    }
  }

  /* --- ボスレーザー被弾 --- */
  if(boss && boss.laser && boss.laser.st === "fire" && frame % 10 === 0){
    const L = boss.laser;
    const dxL = Math.sin(L.a), dyL = Math.cos(L.a);
    const rx = px - boss.x, ry = py - boss.y;
    const t = rx*dxL + ry*dyL;
    if(t > 0){
      const distL = Math.abs(rx*dyL - ry*dxL);
      if(distL < 22 + sqR*0.5) loseSoldiers(2, px, py);
    }
  }

  /* --- パーティクル・フロート --- */
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    if(!p.ring){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; }
    p.life--;
    if(p.life<=0) parts.splice(i,1);
  }
  for(let i=floats.length-1;i>=0;i--){
    const f = floats[i];
    f.y -= 0.8; f.life--;
    if(f.life<=0) floats.splice(i,1);
  }
  for(let i=banners.length-1;i>=0;i--){ if(--banners[i].life<=0) banners.splice(i,1); }
  if(shake>0) shake *= 0.85;
  if(flashWhite>0) flashWhite--;
  if(invT>0) invT--;
}

function applyGate(op){
  const before = count;
  if(op[0]==="+") count += op[1];
  if(op[0]==="-") count -= op[1];
  if(op[0]==="x") count *= op[1];
  if(op[0]==="/") count = Math.ceil(count / op[1]);
  count = Math.max(1, Math.min(999, count));
  const diff = count - before;
  if(diff >= 0){ banner((diff>0?"+":"±")+diff+" 兵員増強!", "#7da453", 70); beep(620,0.1,"square",0.05); beep(930,0.12,"square",0.04); }
  else { banner(diff+" 兵員損耗…", "#c0392b", 70); beep(200,0.18,"sawtooth",0.06,-120); }
}

/* =====================================================================
   ボスAI
===================================================================== */
function bossAct(){
  const b = boss, def = b.def;
  b.t++;
  b.phase = (b.hp < b.maxhp*0.5) ? 2 : 1;
  const spdMul = b.phase===2 ? 0.62 : 1;

  if(b.y < b.ty && !b.chg){ b.y += 1.5; return; }

  if(b.chg){
    const c = b.chg;
    if(!c.back){
      b.x += (c.tx-b.x)*0.09; b.y += (c.ty-b.y)*0.09;
      if(Math.abs(b.y-c.ty)<8){ c.back=true; }
    }else{
      b.y += (b.ty-b.y)*0.05; b.x += (W/2-b.x)*0.02;
      if(Math.abs(b.y-b.ty)<6) b.chg=null;
    }
  }else if(def.move==="sway"){
    b.x = W/2 + Math.sin(b.t*def.spd) * 150;
  }else if(def.move==="heli"){
    b.x = W/2 + Math.sin(b.t*def.spd) * 170;
    b.y = b.ty + Math.sin(b.t*0.05)*16;
  }else if(def.move==="slow"){
    b.x = W/2 + Math.sin(b.t*def.spd) * 90;
  }

  b.patT++;
  const patLen = Math.floor(160 * (b.phase===2?0.8:1));
  if(b.patT > patLen){
    b.patT = 0;
    b.patI = (b.patI+1) % def.patterns.length;
    if(b.laser) b.laser = null;
  }
  const pat = def.patterns[b.patI];
  const every = (n)=> b.patT % Math.max(3, Math.floor(n*spdMul)) === 0;

  if(pat==="fan" && every(26)){
    const n = b.phase===2 ? 9 : 7;
    for(let k=0;k<n;k++){
      const a = Math.PI/2 + (k-(n-1)/2)*0.24;
      ebullets.push({ x:b.x, y:b.y+b.r*0.6, vx:Math.cos(a)*2.9, vy:Math.sin(a)*2.9 });
    }
    beep(260,0.07,"square",0.035,-100);
  }
  if(pat==="aimed" && every(15)){
    const a = Math.atan2(py-b.y, px-b.x);
    ebullets.push({ x:b.x, y:b.y+b.r*0.5, vx:Math.cos(a)*4.3, vy:Math.sin(a)*4.3 });
    beep(340,0.05,"square",0.03,-150);
  }
  if(pat==="ring" && every(46)){
    const n = b.phase===2 ? 20 : 14;
    const off = Math.random()*Math.PI;
    for(let k=0;k<n;k++){
      const a = off + k/n*Math.PI*2;
      ebullets.push({ x:b.x, y:b.y, vx:Math.cos(a)*2.5, vy:Math.sin(a)*2.5 });
    }
    beep(200,0.1,"square",0.04,-80);
  }
  if(pat==="spiral" && every(5)){
    b.spA += 0.31;
    for(let k=0;k<(b.phase===2?3:2);k++){
      const a = b.spA + k*Math.PI*2/(b.phase===2?3:2);
      ebullets.push({ x:b.x, y:b.y, vx:Math.cos(a)*2.7, vy:Math.sin(a)*2.7 });
    }
  }
  if(pat==="rain" && every(7)){
    const x = b.x + (Math.random()-0.5)*300;
    ebullets.push({ x: Math.max(10,Math.min(W-10,x)), y:b.y+20, vx:(Math.random()-0.5)*0.8, vy:3.2+Math.random() });
  }
  if(pat==="summon" && every(85)){
    enemies.push({ t:"inf", x:b.x-60, y:b.y+30, hp:ehp("inf"), spd:1.9, r:11, power:2, ft:0 });
    enemies.push({ t:"inf", x:b.x+60, y:b.y+30, hp:ehp("inf"), spd:1.9, r:11, power:2, ft:0 });
    if(b.phase===2) enemies.push({ t:"zig", x:b.x, bx:b.x, y:b.y+30, hp:ehp("zig"), spd:3.1, r:10, power:2, ph:Math.random()*6.28 });
    beep(150,0.15,"sawtooth",0.05);
  }
  if(pat==="charge" && b.patT === 40 && !b.chg){
    b.chg = { tx:px, ty:Math.min(py-60, H-200), back:false };
    banner("突進警戒!", "#c0392b", 40);
    beep(90,0.3,"sawtooth",0.09,80);
  }
  if(pat==="missiles" && every(38)){
    for(const sgn of [-1,1]){
      ebullets.push({ x:b.x+sgn*b.r*0.7, y:b.y, vx:sgn*3, vy:-1.5, homing:true, hlife:140, big:true });
    }
    beep(500,0.1,"sawtooth",0.04,-300);
  }
  if(pat==="bombs" && every(55)){
    for(let k=-1;k<=1;k++){
      ebullets.push({ x:b.x+k*30, y:b.y+10, vx:k*1.6+(Math.random()-0.5), vy:1.2, bomb: 60+Math.abs(k)*12, big:true });
    }
    beep(180,0.12,"square",0.05,-60);
  }
  if(pat==="blink"){
    if(b.patT < 30) b.alpha = Math.max(0.1, 1 - b.patT/30);
    else if(b.patT === 30){ b.x = 70 + Math.random()*(W-140); }
    else if(b.patT < 60) b.alpha = Math.min(1, (b.patT-30)/30);
    else if(b.patT === 60){
      const n = 12;
      for(let k=0;k<n;k++){
        const a = k/n*Math.PI*2;
        ebullets.push({ x:b.x, y:b.y, vx:Math.cos(a)*3, vy:Math.sin(a)*3 });
      }
      beep(700,0.1,"sawtooth",0.05,-400);
    }
  }else{
    b.alpha = Math.min(1, b.alpha+0.05);
  }
  if(pat==="laser"){
    if(!b.laser && b.patT === 20){
      b.laser = { a: Math.atan2(px-b.x, py-b.y), sweep: (px < b.x ? -1 : 1)*0.011, t:0, st:"aim" };
    }
    if(b.laser){
      const L = b.laser;
      L.t++;
      if(L.st==="aim"){
        L.a += (Math.atan2(px-b.x, py-b.y) - L.a)*0.08;
        if(L.t > 45){ L.st="fire"; L.t=0; beep(60,0.7,"sawtooth",0.1,900); }
      }else if(L.st==="fire"){
        L.a += L.sweep;
        shake = Math.max(shake, 3);
        if(L.t > (b.phase===2?80:60)){ b.laser=null; }
      }
    }
  }

  if(b.flash>0) b.flash--;
  const sqR = squadRadius();
  const dx=b.x-px, dy=b.y-py;
  if(dx*dx+dy*dy < (sqR+b.r)*(sqR+b.r)*0.5 && frame%18===0) loseSoldiers(3, px, py-30);
}

function killBoss(){
  if(!boss) return;
  boom(boss.x, boss.y, 80, "#e8a33d", true);
  boom(boss.x, boss.y, 50, "#c0392b", true);
  boom(boss.x, boss.y, 30, "#fff", true);
  noiseBoom(1.0, 0.24);
  shake = 18; flashWhite = 10;
  const p = gainPoints(hiddenIdx>=0 ? 1500*(hiddenIdx+1) : 300 * stage);
  saveGame();
  addFloat(boss.x, boss.y, "+"+p+" PT", "#ff8ab0");
  boss = null;
  ebullets = []; enemies = [];
  if(hiddenIdx >= 0){
    if(hiddenIdx < HIDDEN.length-1){
      hiddenIdx++;
      checkpoint = { stage, dist, count, owned: cloneOwned(owned), points, chara, hidden: hiddenIdx };
      hiddenSpawnT = 160;
      state = "play";
      banner("……何かが近づいてくる", "#ff5040", 150);
      return;
    }
    hiddenIdx = -1;
    hiddenDone = true;
    setTimeout(showEnding, 900);
    return;
  }
  setTimeout(showClear, 900);
}

/* =====================================================================
   描画
===================================================================== */
function draw(){
  ctx.save();
  if(shake > 0.5) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);

  ctx.fillStyle = "#252b1c"; ctx.fillRect(-20,-20,W+40,H+40);
  ctx.fillStyle = "#2e3522"; ctx.fillRect(60,0,W-120,H);
  ctx.strokeStyle = "#3c452c"; ctx.lineWidth = 3;
  ctx.setLineDash([26,20]); ctx.lineDashOffset = -scroll;
  ctx.beginPath(); ctx.moveTo(63,0); ctx.lineTo(63,H); ctx.moveTo(W-63,0); ctx.lineTo(W-63,H); ctx.stroke();
  ctx.setLineDash([]);
  srandDraw();
  ctx.strokeStyle = "rgba(0,0,0,0.18)"; ctx.lineWidth=8;
  ctx.setLineDash([40,30]); ctx.lineDashOffset=-scroll*1.1;
  ctx.beginPath(); ctx.moveTo(W/2-30,0); ctx.lineTo(W/2-30,H); ctx.moveTo(W/2+30,0); ctx.lineTo(W/2+30,H); ctx.stroke();
  ctx.setLineDash([]);

  for(const c of cps) drawCheckpoint(c);
  for(const g of gates) drawGate(g);

  /* 隕石の照準・落下 */
  for(const m of meteors){
    if(m.t < 28){
      ctx.strokeStyle = "rgba(255,120,60," + (0.3 + m.t/28*0.4) + ")";
      ctx.lineWidth = 2;
      ctx.setLineDash([6,6]);
      ctx.beginPath(); ctx.arc(m.tx, m.ty, m.blast*0.8*(0.6+0.4*Math.sin(frame*0.3)), 0, 7); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "rgba(255,120,60,0.6)";
      ctx.font = "bold 11px monospace"; ctx.textAlign="center";
      ctx.fillText("▼", m.tx, m.ty+4);
    }else if(m.t < 44){
      const pr = (m.t-28)/16;
      const mx = m.tx + 140*(1-pr), my = m.ty - 480*(1-pr);
      ctx.fillStyle = "#6a4632";
      ctx.beginPath(); ctx.arc(mx, my, 11, 0, 7); ctx.fill();
      ctx.fillStyle = "#3d2a1e";
      ctx.beginPath(); ctx.arc(mx-3, my-3, 4, 0, 7); ctx.fill();
      if(parts.length < 650)
        parts.push({x:mx+7, y:my-7, vx:1, vy:-1, life:9, col: Math.random()<0.5?"#ff9a4a":"rgba(120,110,100,0.6)", sz:4});
    }
  }

  if(boss && boss.laser) drawLaser();

  /* スナイパー照準線 */
  for(const e of enemies){
    if(e.t==="sniper" && e.st==="cycle" && e.at < 42){
      ctx.strokeStyle = "rgba(255,80,64," + (0.25 + (e.at/42)*0.4) + ")";
      ctx.lineWidth = e.at>30 ? 2.5 : 1.5;
      ctx.setLineDash([8,6]);
      ctx.beginPath(); ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x+Math.cos(e.aimA)*900, e.y+Math.sin(e.aimA)*900); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  /* --- 弾 --- */
  for(const b of bullets){
    if(b.type==="laser"){
      ctx.save();
      ctx.globalCompositeOperation="lighter";
      const wmul = b.giga ? 2.2 : 1;
      ctx.strokeStyle = "rgba(110,240,255,0.35)"; ctx.lineWidth = Math.max(4, b.sz*1.4)*wmul;
      ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-b.vx*3.6, b.y-b.vy*3.6); ctx.stroke();
      ctx.strokeStyle = b.col; ctx.lineWidth = Math.max(2, b.sz*0.7)*wmul;
      ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-b.vx*3.6, b.y-b.vy*3.6); ctx.stroke();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1*wmul;
      ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-b.vx*3.6, b.y-b.vy*3.6); ctx.stroke();
      ctx.restore();
    }else if(b.type==="plasma"){
      const col1 = b.suck ? "#2a0a3a" : "#fff";
      const g = ctx.createRadialGradient(b.x,b.y,1,b.x,b.y,b.sz*1.7);
      g.addColorStop(0,col1); g.addColorStop(0.35,b.col); g.addColorStop(1,"rgba(215,138,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.sz*1.7,0,7); ctx.fill();
      if(b.suck){
        ctx.strokeStyle="rgba(215,138,255,0.5)"; ctx.lineWidth=1.5;
        const rr = b.sz*1.9 + Math.sin(frame*0.3)*4;
        ctx.beginPath(); ctx.arc(b.x,b.y,rr,frame*0.1,frame*0.1+4.5); ctx.stroke();
      }else{
        ctx.strokeStyle="rgba(255,255,255,0.7)"; ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(b.x-b.sz, b.y);
        ctx.lineTo(b.x-b.sz*0.3, b.y+(Math.random()-0.5)*b.sz);
        ctx.lineTo(b.x+b.sz*0.3, b.y+(Math.random()-0.5)*b.sz);
        ctx.lineTo(b.x+b.sz, b.y);
        ctx.stroke();
      }
      // 周回スパーク
      ctx.fillStyle = "#fff";
      for(let sp3=0; sp3<3; sp3++){
        const sa = frame*0.22 + sp3*Math.PI*2/3;
        ctx.beginPath(); ctx.arc(b.x+Math.cos(sa)*b.sz*1.5, b.y+Math.sin(sa)*b.sz*1.5, 1.6, 0, 7); ctx.fill();
      }
    }else if(b.type==="flak"){
      ctx.save(); ctx.translate(b.x,b.y);
      ctx.fillStyle = "#8a8a4a";
      ctx.beginPath(); ctx.ellipse(0,0,4.5,7,0,0,7); ctx.fill();
      ctx.fillStyle = (b.fuse<10 && frame%4<2) ? "#ff5040" : "#e8ff5e";
      ctx.beginPath(); ctx.arc(0,-5,2.4,0,7); ctx.fill();
      ctx.restore();
    }else if(b.type==="rocket"){
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);
      ctx.fillStyle = b.col; ctx.fillRect(-3.5,-8,7,14);
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(0,-11); ctx.lineTo(-3.5,-6); ctx.lineTo(3.5,-6); ctx.fill();
      ctx.fillStyle = "#ffd05a"; ctx.fillRect(-2.5,6,5,4+Math.random()*4);
      ctx.restore();
    }else if(b.type==="homing"){
      // 発光ヘッド
      const hg = ctx.createRadialGradient(b.x,b.y,0.5,b.x,b.y,8);
      hg.addColorStop(0,"#fff"); hg.addColorStop(0.4,b.col); hg.addColorStop(1,"rgba(157,255,94,0)");
      ctx.fillStyle = hg;
      ctx.beginPath(); ctx.arc(b.x,b.y,8,0,7); ctx.fill();
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);
      ctx.fillStyle = b.col; ctx.fillRect(-2.5,-7,5,12);
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(0,-9); ctx.lineTo(-2.5,-5); ctx.lineTo(2.5,-5); ctx.fill();
      ctx.restore();
    }else if(b.type==="wave"){
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI/2);
      ctx.globalCompositeOperation="lighter";
      ctx.strokeStyle = "rgba(255,138,176,0.85)"; ctx.lineWidth=5;
      ctx.beginPath(); ctx.arc(0, 34, 42, -Math.PI*0.82, -Math.PI*0.18); ctx.stroke();
      ctx.strokeStyle = "#fff"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0, 34, 42, -Math.PI*0.78, -Math.PI*0.22); ctx.stroke();
      ctx.restore();
    }else{
      if(b.flame){
        // ドラゴンブレス: 揺らめく炎
        ctx.fillStyle = Math.random()<0.5 ? "#ffb14a" : "#ff6a3a";
        ctx.beginPath(); ctx.arc(b.x, b.y, 3+Math.random()*4, 0, 7); ctx.fill();
        if(Math.random()<0.3){ ctx.fillStyle="#fff2c0"; ctx.beginPath(); ctx.arc(b.x,b.y,1.8,0,7); ctx.fill(); }
      }else if(b.wid===1){
        // ショットガン: 散弾粒(寿命で減衰)
        ctx.globalAlpha = Math.min(1, b.life/18);
        ctx.fillStyle = b.col;
        ctx.beginPath(); ctx.arc(b.x, b.y, 3.2, 0, 7); ctx.fill();
        ctx.fillStyle = "#fff2c0";
        ctx.fillRect(b.x-1, b.y-1, 2, 2);
        ctx.globalAlpha = 1;
      }else{
        // ライフル: 白芯トレーサー
        ctx.strokeStyle = b.col; ctx.lineWidth = Math.max(2.5, b.sz*0.7);
        ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-b.vx*1.8, b.y-b.vy*1.8); ctx.stroke();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-b.vx*1.4, b.y-b.vy*1.4); ctx.stroke();
        if(b.pierce>0){
          // 貫通弾: 先端が光る
          ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(b.x, b.y, b.pierce>50?3:2, 0, 7); ctx.fill();
        }
      }
    }
  }
  for(const b of ebullets){
    const r = b.big ? 5.5 : 4;
    ctx.fillStyle = "#ff6b4a";
    ctx.beginPath(); ctx.arc(b.x,b.y,r,0,7); ctx.fill();
    ctx.fillStyle="#ffd0a0"; ctx.fillRect(b.x-1.5,b.y-1.5,3,3);
  }

  for(const e of enemies) drawEnemy(e);
  if(boss) drawBoss();

  /* 斬撃 */
  for(const s of slashes){
    const pr = s.t/9;
    ctx.save();
    ctx.globalAlpha = 1 - pr;
    ctx.globalCompositeOperation = "lighter";
    if(s.full){
      // 幻影剣舞: 全周リング
      const rr = s.r * (0.25 + pr*0.85);
      ctx.strokeStyle = "#ff8ab0"; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.arc(s.x, s.y, rr, 0, 7); ctx.stroke();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(s.x, s.y, rr*0.92, 0, 7); ctx.stroke();
    }else{
      const rr = s.r * (0.4 + pr*0.7);
      const a0 = s.dir>0 ? -Math.PI*0.95 : -Math.PI*0.05;
      const a1 = s.dir>0 ? -Math.PI*0.05 : -Math.PI*0.95;
      ctx.strokeStyle = "#ff8ab0"; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(s.x, s.y, rr, Math.min(a0,a1), Math.max(a0,a1)); ctx.stroke();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(s.x, s.y, rr, Math.min(a0,a1), Math.max(a0,a1)); ctx.stroke();
    }
    ctx.restore();
  }

  /* オービタル光柱 */
  for(const pl of pillars){
    if(pl.t < 22){
      ctx.strokeStyle = "rgba(255,80,64," + (0.3 + pl.t/22*0.5) + ")";
      ctx.lineWidth = 2 + pl.t*0.15;
      ctx.setLineDash([10,8]);
      ctx.beginPath(); ctx.moveTo(pl.x, 0); ctx.lineTo(pl.x, H); ctx.stroke();
      ctx.setLineDash([]);
    }else{
      const a = 1 - (pl.t-22)/14;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = a;
      const w2 = 26 + Math.sin(frame)*4;
      const g3 = ctx.createLinearGradient(pl.x-w2, 0, pl.x+w2, 0);
      g3.addColorStop(0,"rgba(255,215,106,0)");
      g3.addColorStop(0.5,"rgba(255,240,200,0.9)");
      g3.addColorStop(1,"rgba(255,215,106,0)");
      ctx.fillStyle = g3;
      ctx.fillRect(pl.x-w2, 0, w2*2, H);
      ctx.restore();
    }
  }

  /* 友軍戦車 */
  for(const al of allies){
    ctx.save(); ctx.translate(al.x, al.y);
    const s2 = al.big ? 1.6 : 1;
    ctx.scale(s2, s2);
    ctx.fillStyle="rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(0,12,20,6,0,0,7); ctx.fill();
    ctx.fillStyle="#4a5a34"; ctx.fillRect(-16,-14,32,28);
    ctx.fillStyle="#2c331f"; ctx.fillRect(-20,-14,5,28); ctx.fillRect(15,-14,5,28);
    ctx.fillStyle="#5f7342"; ctx.beginPath(); ctx.arc(0,0,9,0,7); ctx.fill();
    ctx.fillStyle="#222b16"; ctx.fillRect(-2,-24,4,22);
    ctx.fillStyle="#e8a33d"; ctx.fillRect(-6,8,12,3);
    if(al.big){ ctx.fillStyle="#a8c86a"; ctx.font="bold 8px monospace"; ctx.textAlign="center"; ctx.fillText("MAMMOTH", 0, -16); }
    ctx.restore();
  }

  /* アタックドローン機体 */
  {
    const dro2 = owned.find(o=>WEAPONS[o.id].type==="drone");
    if(dro2 && (state==="play"||state==="boss"||state==="shop")){
      const dp2 = wparam(dro2);
      for(let i2=0;i2<dp2.n;i2++){
        const dx2 = px + (i2-(dp2.n-1)/2)*26;
        const dy2 = py - 58 + Math.sin(frame*0.1+i2)*4;
        ctx.strokeStyle="rgba(94,232,200,0.5)"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(dx2-8+Math.sin(frame*0.9)*2, dy2-4); ctx.lineTo(dx2+8-Math.sin(frame*0.9)*2, dy2-4); ctx.stroke();
        ctx.fillStyle="#2a3a34";
        ctx.beginPath();
        ctx.moveTo(dx2, dy2-6); ctx.lineTo(dx2+5, dy2); ctx.lineTo(dx2, dy2+6); ctx.lineTo(dx2-5, dy2);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = dro2.lv>=5 ? "#ff8ab0" : "#5ee8c8";
        ctx.fillRect(dx2-1.5, dy2-1.5, 3, 3);
      }
    }
  }

  if(state==="play"||state==="boss"||state==="shop") drawSquad();

  for(const p of parts){
    ctx.globalAlpha = Math.min(1, p.life/12);
    if(p.ring){
      ctx.strokeStyle = p.col; ctx.lineWidth=3;
      const rr = p.maxr * (1 - p.life/12);
      ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(1,rr),0,7); ctx.stroke();
    }else{
      ctx.fillStyle = p.col;
      ctx.fillRect(p.x-p.sz/2, p.y-p.sz/2, p.sz, p.sz);
    }
  }
  ctx.globalAlpha = 1;

  /* ポイントフロート */
  ctx.font = "bold 12px 'Courier New',monospace"; ctx.textAlign="center";
  for(const f of floats){
    ctx.globalAlpha = Math.min(1, f.life/16);
    ctx.fillStyle = "#000"; ctx.fillText(f.txt, f.x+1, f.y+1);
    ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  drawHUD();

  let by = H*0.32;
  for(const b of banners){
    const a = Math.min(1, b.life/20, (b.max-b.life)/8 + 0.2);
    ctx.globalAlpha = a;
    ctx.font = "bold 24px 'Courier New',monospace";
    ctx.textAlign = "center";
    ctx.fillStyle = "#000"; ctx.fillText(b.text, W/2+2, by+2);
    ctx.fillStyle = b.color; ctx.fillText(b.text, W/2, by);
    ctx.globalAlpha = 1;
    by += 32;
  }

  if(bossWarn > 0 && Math.floor(bossWarn/12)%2===0){
    ctx.fillStyle = "rgba(192,57,43,0.18)"; ctx.fillRect(0,H*0.3,W,90);
    ctx.font = "bold 36px 'Courier New',monospace"; ctx.textAlign="center";
    ctx.fillStyle = "#c0392b"; ctx.fillText("⚠ WARNING ⚠", W/2, H*0.3+56);
  }
  if(flashWhite>0){
    ctx.globalAlpha = flashWhite/12*0.5;
    ctx.fillStyle="#fff"; ctx.fillRect(-20,-20,W+40,H+40);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function srandDraw(){
  const offs = Math.floor(scroll/240);
  for(let k=0;k<7;k++){
    const seg = offs + k;
    srand(seg*97 + 5);
    const yy = seg*240 - scroll + H;
    const y = H - (yy % (H+240));
    const x = 60 + rnd()*(W-120);
    const r = 8 + rnd()*16;
    ctx.fillStyle = "rgba(0,0,0,0.13)";
    ctx.beginPath(); ctx.ellipse((x|0), (y|0)+240, r, r*0.7, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(138,148,96,0.10)";
    ctx.beginPath(); ctx.ellipse(((W-x)|0), (y|0)+90, r*1.4, r, 0.4, 0, 7); ctx.fill();
  }
}

/* ---------- 部隊描画 ---------- */
function tierColors(){
  if(count >= 150) return { body:"#3a3f4a", helm:"#ffd76a" };
  if(count >= 60)  return { body:"#535b3a", helm:"#c9d0a0" };
  return { body:"#6b7a4a", helm:"#46532f" };
}
function drawSoldier(x, y, leader, tc){
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath(); ctx.ellipse(x, y+6, 6, 3, 0, 0, 7); ctx.fill();
  if(leader){
    if(awakened){
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const wf = Math.sin(frame*0.15)*4;
      if(chara===0){
        /* ストライカー覚醒: 金の機械翼3枚+肩部砲 */
        ctx.strokeStyle = "#ffd76a"; ctx.lineWidth = 2.5; ctx.globalAlpha = 0.9;
        for(const sgn of [-1,1]){
          for(let f2=0;f2<3;f2++){
            ctx.beginPath();
            ctx.moveTo(x+sgn*5, y-3-f2*2);
            ctx.lineTo(x+sgn*(14+f2*7+wf*0.5), y-10-f2*7);
            ctx.lineTo(x+sgn*(21+f2*8+wf), y-7-f2*8);
            ctx.stroke();
          }
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle="#7a6a3a"; ctx.fillRect(x-10,y-8,4,6); ctx.fillRect(x+6,y-8,4,6);
        ctx.fillStyle="#ffd76a"; ctx.fillRect(x-9.5,y-10,3,2); ctx.fillRect(x+6.5,y-10,3,2);
      }else if(chara===1){
        /* ミサイリア覚醒: ホバースラスター+周回ミサイルポッド */
        ctx.fillStyle="rgba(157,255,94,0.7)";
        const fl2 = 6+Math.sin(frame*0.5)*3;
        ctx.beginPath(); ctx.moveTo(x-4,y+9); ctx.lineTo(x,y+9+fl2); ctx.lineTo(x+4,y+9); ctx.fill();
        ctx.strokeStyle="#9dff5e"; ctx.lineWidth=1.5; ctx.globalAlpha=0.85;
        for(let p2=0;p2<4;p2++){
          const a2 = frame*0.08 + p2*Math.PI/2;
          const px2 = x+Math.cos(a2)*16, py2 = y-6+Math.sin(a2)*9;
          ctx.strokeRect(px2-2.5, py2-4, 5, 8);
          ctx.beginPath(); ctx.moveTo(px2, py2-4); ctx.lineTo(px2, py2-7); ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle="#9dff5e"; ctx.fillRect(x-5,y-8,10,2);
      }else{
        /* ブレイド覚醒: 背のX二刀+なびくマフラー+花弁 */
        ctx.strokeStyle="#ff8ab0"; ctx.lineWidth=3; ctx.globalAlpha=0.9;
        ctx.beginPath(); ctx.moveTo(x-14,y-22); ctx.lineTo(x+9,y+4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x+14,y-22); ctx.lineTo(x-9,y+4); ctx.stroke();
        ctx.strokeStyle="#fff"; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(x-14,y-22); ctx.lineTo(x+9,y+4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x+14,y-22); ctx.lineTo(x-9,y+4); ctx.stroke();
        ctx.globalAlpha = 0.8;
        ctx.strokeStyle="#e8e0e8"; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(x-3,y-9);
        ctx.quadraticCurveTo(x-14-wf*1.5, y-4, x-20-wf*2, y+6); ctx.stroke();
        ctx.globalAlpha = 1;
        if(frame%9===0 && parts.length<600)
          parts.push({x:x+(Math.random()-0.5)*24, y:y-14, vx:(Math.random()-0.5), vy:0.7, life:22, col:"#ffb0c8", sz:2.4});
      }
      /* 共通ヘイロー */
      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = CHARS[chara].col; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y-6, 9+Math.sin(frame*0.2)*1.5, 0, 7); ctx.stroke();
      ctx.restore();
      if(frame%7===0 && parts.length<600)
        parts.push({x:x+(Math.random()-0.5)*14, y:y+8, vx:0, vy:-0.9, life:14, col:CHARS[chara].col, sz:2});
    }
    const fl = Math.sin(frame*0.2)*3;
    // キャラ別マント色(覚醒で発光色に)
    ctx.fillStyle = awakened ? CHARS[chara].col : (chara===0 ? "#a3262a" : chara===1 ? "#3f6b30" : "#e8e0e8");
    ctx.beginPath();
    ctx.moveTo(x-5, y-6);
    ctx.quadraticCurveTo(x-10-fl, y+6, x-7+fl*0.5, y+14);
    ctx.lineTo(x+7-fl*0.5, y+14);
    ctx.quadraticCurveTo(x+10+fl, y+6, x+5, y-6);
    ctx.fill();
  }
  ctx.fillStyle = leader ? "#9aa86a" : tc.body;
  ctx.fillRect(x-4, y-4, 8, 10);
  if(leader && chara===2){
    // ブレイド: 刀
    ctx.strokeStyle = "#e8e8f0"; ctx.lineWidth = 2;
    const sa = Math.sin(frame*0.15)*0.3 - 0.9;
    ctx.beginPath(); ctx.moveTo(x+4, y-2);
    ctx.lineTo(x+4+Math.cos(sa)*15, y-2+Math.sin(sa)*15); ctx.stroke();
  }else{
    ctx.fillStyle = "#2b2f22"; ctx.fillRect(x+2.5, y-12, 2.5, 9);
  }
  if(leader && chara===1){
    // ミサイリア: 肩ポッド
    ctx.fillStyle = "#3a4a2e";
    ctx.fillRect(x-9, y-9, 4, 7); ctx.fillRect(x+5, y-9, 4, 7);
    ctx.fillStyle = "#9dff5e";
    ctx.fillRect(x-8.5, y-10, 3, 2); ctx.fillRect(x+5.5, y-10, 3, 2);
  }
  ctx.fillStyle = leader ? CHARS[chara].col : tc.helm;
  ctx.beginPath(); ctx.arc(x, y-6, leader?5:4.4, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(x, y-6, leader?5:4.4, 0, 7); ctx.stroke();
  if(leader){
    ctx.fillStyle="#e8e0c0";
    ctx.fillRect(x-1, y-16, 2, 6);
  }
}
function drawSquad(){
  const blink = invT>0 && Math.floor(frame/4)%2===0;
  if(blink) ctx.globalAlpha = 0.45;
  const sqR = squadRadius();
  const pw = Math.min(1, firepower()/2500);
  const pulse = 0.5 + Math.sin(frame*0.12)*0.5;
  const g = ctx.createRadialGradient(px,py+20,4,px,py+20,sqR+30);
  g.addColorStop(0, `rgba(232,163,61,${0.10+pw*0.18*pulse})`);
  g.addColorStop(1, "rgba(232,163,61,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(px,py+20,sqR+30,0,7); ctx.fill();

  const tc = tierColors();
  const n = Math.min(count, FORM.length);
  for(let i=n-1; i>=1; i--){
    const [ox, oy] = FORM[i];
    drawSoldier(px+ox, py+oy, false, tc);
  }
  for(let k=1;k<owned.length;k++){
    const o = owned[k];
    const wp = WEAPONS[o.id];
    if(wp.type==="orb") continue;
    const d = droneXY(k);
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath(); ctx.ellipse(d.x, d.y+9, 6, 2.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#33392a";
    ctx.fillRect(d.x-6, d.y-4, 12, 8);
    ctx.fillStyle = wp.col;
    ctx.fillRect(d.x-2.5, d.y-8, 5, 5);
    ctx.strokeStyle = wp.col; ctx.lineWidth=1.5; ctx.globalAlpha=0.8;
    ctx.strokeRect(d.x-6.5, d.y-4.5, 13, 9);
    ctx.globalAlpha=1;
    ctx.fillStyle = o.lv>=5 ? "#ff8ab0" : "#ffd76a";
    for(let l=0;l<o.lv;l++) ctx.fillRect(d.x-6+l*3, d.y+6, 2, 2);
  }
  // オーブの残像(2段)
  for(const gof of [10, 5]){
    ctx.globalAlpha = gof===10 ? 0.15 : 0.3;
    for(const ob of orbList(gof)){
      ctx.fillStyle = "#7ec8ff";
      ctx.beginPath(); ctx.arc(ob.x, ob.y, ob.r*0.7, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  for(const ob of orbList()){
    const g2 = ctx.createRadialGradient(ob.x,ob.y,1,ob.x,ob.y,ob.r*1.6);
    g2.addColorStop(0,"#fff"); g2.addColorStop(0.4,"#7ec8ff"); g2.addColorStop(1,"rgba(126,200,255,0)");
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(ob.x,ob.y,ob.r*1.6,0,7); ctx.fill();
    ctx.strokeStyle="rgba(126,200,255,0.5)"; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(ob.x,ob.y,ob.r,0,7); ctx.stroke();
  }
  drawSoldier(px, py, true, tc);

  const t = "×" + count;
  ctx.font = "bold 16px 'Courier New',monospace"; ctx.textAlign="center";
  const tw = ctx.measureText(t).width + 14;
  ctx.fillStyle = "rgba(12,14,8,0.8)";
  ctx.fillRect(px-tw/2, py-48, tw, 20);
  ctx.strokeStyle = count>=60 ? "#ffd76a" : "#8a9460"; ctx.strokeRect(px-tw/2, py-48, tw, 20);
  ctx.fillStyle = count>=60 ? "#ffd76a" : "#d8c98f"; ctx.fillText(t, px, py-33);
  ctx.globalAlpha = 1;
}

function drawEnemy(e){
  ctx.save(); ctx.translate(e.x, e.y);
  if(e.t === "inf"){
    ctx.fillStyle="rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(0,7,7,3,0,0,7); ctx.fill();
    ctx.fillStyle = "#7a4a3a"; ctx.fillRect(-5,-4,10,11);
    ctx.fillStyle = "#3a2520"; ctx.beginPath(); ctx.arc(0,-6,5,0,7); ctx.fill();
    ctx.fillStyle = "#caa"; ctx.fillRect(-1.5,-3,3,3);
  }else if(e.t === "zig"){
    // ジグザグバイク兵
    ctx.fillStyle="rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(0,8,8,3,0,0,7); ctx.fill();
    const lean = Math.cos(e.y*0.035 + e.ph) * 0.5;
    ctx.rotate(lean);
    ctx.fillStyle = "#2c2620"; ctx.fillRect(-3,-10,6,20);        // 車体
    ctx.fillStyle = "#111"; 
    ctx.beginPath(); ctx.ellipse(0,-9,3.4,4.5,0,0,7); ctx.fill(); // 前輪
    ctx.beginPath(); ctx.ellipse(0,9,3.4,4.5,0,0,7); ctx.fill();  // 後輪
    ctx.fillStyle = "#8a5a3a"; ctx.fillRect(-4,-3,8,7);           // ライダー
    ctx.fillStyle = "#3a2520"; ctx.beginPath(); ctx.arc(0,-4,3.6,0,7); ctx.fill();
    ctx.fillStyle = "#e8a33d"; ctx.fillRect(-1.5,-11,3,2);        // ヘッドライト
  }else if(e.t === "shooter"){
    ctx.fillStyle="rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(0,9,9,4,0,0,7); ctx.fill();
    ctx.fillStyle = "#6e3f33"; ctx.fillRect(-8,-7,16,15);
    ctx.fillStyle = "#33211c"; ctx.fillRect(-3,2,6,12);
    ctx.fillStyle = "#3a2520"; ctx.beginPath(); ctx.arc(0,-9,6,0,7); ctx.fill();
  }else if(e.t === "hover"){
    // 横断ホバードローン
    const bob = Math.sin(frame*0.15+e.ph)*2;
    ctx.translate(0, bob);
    ctx.fillStyle="rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.ellipse(0,14,10,3,0,0,7); ctx.fill();
    ctx.fillStyle = "#4a4438"; ctx.fillRect(-10,-5,20,10);
    ctx.fillStyle = "#2a2620"; ctx.fillRect(-14,-2,4,4); ctx.fillRect(10,-2,4,4);
    // ローター(高速回転の残像)
    ctx.strokeStyle = "rgba(220,220,200,0.5)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-16+Math.sin(frame)*3,-6); ctx.lineTo(-8,-6); ctx.moveTo(8,-6); ctx.lineTo(16+Math.sin(frame+2)*3,-6); ctx.stroke();
    ctx.fillStyle = "#ff6b4a"; ctx.beginPath(); ctx.arc(0,2,3,0,7); ctx.fill(); // 下部銃口
  }else if(e.t === "sniper"){
    // スナイパー三脚砲
    ctx.fillStyle="rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(0,11,10,3.5,0,0,7); ctx.fill();
    ctx.strokeStyle = "#2f2a22"; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(0,0); ctx.lineTo(-9,11);
    ctx.moveTo(0,0); ctx.lineTo(9,11);
    ctx.moveTo(0,0); ctx.lineTo(0,12);
    ctx.stroke();
    ctx.fillStyle = "#3c3630"; ctx.beginPath(); ctx.arc(0,-2,7,0,7); ctx.fill();
    // 長砲身(照準方向)
    const aa = (e.st==="cycle") ? e.aimA : Math.PI/2;
    ctx.strokeStyle = "#1e1b16"; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(0,-2); ctx.lineTo(Math.cos(aa)*22, -2+Math.sin(aa)*22); ctx.stroke();
    // スコープ光
    if(e.st==="cycle" && e.at<42 && frame%16<8){ ctx.fillStyle="#ff5040"; ctx.beginPath(); ctx.arc(0,-6,2.4,0,7); ctx.fill(); }
  }else{ // tank
    ctx.fillStyle="rgba(0,0,0,0.35)"; ctx.beginPath(); ctx.ellipse(0,14,22,7,0,0,7); ctx.fill();
    ctx.fillStyle = "#4a3a30"; ctx.fillRect(-20,-16,40,32);
    ctx.fillStyle = "#2c231d"; ctx.fillRect(-24,-16,6,32); ctx.fillRect(18,-16,6,32);
    ctx.fillStyle = "#5d4a3c"; ctx.beginPath(); ctx.arc(0,0,11,0,7); ctx.fill();
    ctx.fillStyle = "#2c231d"; ctx.fillRect(-2.5,2,5,22);
    ctx.fillStyle = "#7a4a3a"; ctx.fillRect(-10,-12,8,5);
  }
  const base = ehp(e.t);
  if(e.hp < base){
    const w = e.r*2, ratio = Math.max(0, e.hp/base);
    ctx.fillStyle="#000"; ctx.fillRect(-w/2, -e.r-9, w, 4);
    ctx.fillStyle="#c0392b"; ctx.fillRect(-w/2, -e.r-9, w*ratio, 4);
  }
  ctx.restore();
}
