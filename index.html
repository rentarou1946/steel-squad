/* ---------- 裏ボス描画(グロテスク3種 / ctxはボス中心に平行移動済み) ---------- */
function drawHiddenArt(b, k){
  const t = b.t;
  const dxp = px - b.x, dyp = py - b.y;
  const dl = Math.hypot(dxp, dyp) || 1;
  const ex = dxp/dl*3.2, ey = dyp/dl*3.2;   // 目玉がプレイヤーを見る

  if(k === 0){
    /* 蠢く肉塊 グラトニー */
    ctx.strokeStyle="#5a1f2e"; ctx.lineWidth=9; ctx.lineCap="round";
    for(let i2=0;i2<6;i2++){
      const bx=(i2-2.5)*16;
      ctx.beginPath();
      ctx.moveTo(bx, b.r*0.5);
      ctx.quadraticCurveTo(bx+Math.sin(t*0.09+i2)*18, b.r*0.9+10, bx+Math.sin(t*0.07+i2*2)*26, b.r*1.2+14);
      ctx.stroke();
    }
    ctx.fillStyle = "#7a2534";
    ctx.beginPath();
    for(let a2=0;a2<=20;a2++){
      const ang=a2/20*Math.PI*2;
      const rr=b.r*(0.85+Math.sin(ang*3+t*0.08)*0.1+Math.sin(ang*5-t*0.05)*0.06);
      const xx=Math.cos(ang)*rr, yy=Math.sin(ang)*rr*0.9;
      a2?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle="#3d1019"; ctx.lineWidth=3; ctx.stroke();
    ctx.strokeStyle="rgba(40,8,14,0.7)"; ctx.lineWidth=2.5;
    for(let i2=0;i2<5;i2++){
      ctx.beginPath();
      ctx.moveTo(Math.cos(i2*1.3)*10, Math.sin(i2*1.3)*8);
      ctx.quadraticCurveTo(Math.cos(i2*1.3+0.5)*b.r*0.6, Math.sin(i2*1.3+0.5)*b.r*0.5,
                           Math.cos(i2*1.3+1)*b.r*0.85, Math.sin(i2*1.3+1)*b.r*0.75);
      ctx.stroke();
    }
    for(const [ox2,oy2,rr2] of [[-18,-12,8],[14,-18,6],[22,6,7],[-8,14,5],[2,-2,11]]){
      ctx.fillStyle="#e8dcc8"; ctx.beginPath(); ctx.ellipse(ox2,oy2,rr2,rr2*0.75,0,0,7); ctx.fill();
      ctx.fillStyle="#a51f1f"; ctx.beginPath(); ctx.arc(ox2+ex*0.7,oy2+ey*0.7,rr2*0.45,0,7); ctx.fill();
      ctx.fillStyle="#000"; ctx.beginPath(); ctx.arc(ox2+ex,oy2+ey,rr2*0.2,0,7); ctx.fill();
    }
    if(t%9===0 && parts.length<600)
      parts.push({x:b.x+(Math.random()-0.5)*b.r, y:b.y+b.r*0.8, vx:0, vy:1.6, life:22, col:"#6a1626", sz:3.4});
  }
  else if(k === 1){
    /* 百眼の女王 ヘカトン */
    ctx.fillStyle="#2a1836";
    ctx.beginPath();
    for(let a2=0;a2<=18;a2++){
      const ang=a2/18*Math.PI*2;
      const rr=b.r*(0.8+Math.sin(ang*6+t*0.06)*0.12);
      a2?ctx.lineTo(Math.cos(ang)*rr, Math.sin(ang)*rr):ctx.moveTo(Math.cos(ang)*rr, Math.sin(ang)*rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle="#120a1a"; ctx.lineWidth=3; ctx.stroke();
    ctx.strokeStyle="#48306a"; ctx.lineWidth=3;
    for(let i2=0;i2<12;i2++){
      const ang=i2/12*Math.PI*2+t*0.01;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang)*b.r*0.8, Math.sin(ang)*b.r*0.8);
      ctx.lineTo(Math.cos(ang)*(b.r+10+Math.sin(t*0.1+i2)*5), Math.sin(ang)*(b.r+10+Math.sin(t*0.1+i2)*5));
      ctx.stroke();
    }
    for(let i2=0;i2<10;i2++){
      const ang = t*0.02 + i2/10*Math.PI*2;
      const ox2=Math.cos(ang)*b.r*0.58, oy2=Math.sin(ang)*b.r*0.55;
      const blink2 = (Math.floor(t/40)+i2)%7===0;
      ctx.fillStyle="#ded2ea";
      ctx.beginPath(); ctx.ellipse(ox2,oy2,6,blink2?1:4.6,0,0,7); ctx.fill();
      if(!blink2){
        ctx.fillStyle="#7a2fbf"; ctx.beginPath(); ctx.arc(ox2+ex*0.6,oy2+ey*0.6,2.4,0,7); ctx.fill();
      }
    }
    ctx.fillStyle="#efe6f5"; ctx.beginPath(); ctx.ellipse(0,0,17,13,0,0,7); ctx.fill();
    ctx.fillStyle = b.phase===2 ? "#ff3050" : "#8a30d0";
    ctx.beginPath(); ctx.arc(ex*1.6, ey*1.6, 8, 0, 7); ctx.fill();
    ctx.fillStyle="#000"; ctx.beginPath(); ctx.ellipse(ex*2, ey*2, 3, 5.5, 0, 0, 7); ctx.fill();
    ctx.strokeStyle="#3a2050"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(0,0,17,13,0,0,7); ctx.stroke();
  }
  else if(k === 2){
    /* 深淵神 アビス */
    ctx.strokeStyle="#141020"; ctx.lineWidth=10; ctx.lineCap="round";
    for(let i2=0;i2<8;i2++){
      const ang=i2/8*Math.PI*2 + Math.sin(t*0.03+i2)*0.3;
      const L2=b.r*1.35+Math.sin(t*0.08+i2*1.7)*14;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang)*b.r*0.5, Math.sin(ang)*b.r*0.5);
      ctx.quadraticCurveTo(Math.cos(ang+0.3)*b.r, Math.sin(ang+0.3)*b.r, Math.cos(ang)*L2, Math.sin(ang)*L2);
      ctx.stroke();
    }
    for(const [rr2,sp2,cw2] of [[b.r+6,0.04,1],[b.r-8,0.06,-1]]){
      ctx.save(); ctx.rotate(t*sp2*cw2);
      ctx.strokeStyle = b.phase===2 ? "rgba(255,48,80,0.85)" : "rgba(160,40,220,0.8)";
      ctx.lineWidth=4;
      for(let k2=0;k2<8;k2++){
        ctx.rotate(Math.PI/4);
        ctx.beginPath(); ctx.arc(0,0,rr2,-0.32,0.32); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(rr2,0); ctx.lineTo(rr2+7,0); ctx.stroke();
      }
      ctx.restore();
    }
    const vg = ctx.createRadialGradient(0,0,2,0,0,b.r*0.72);
    vg.addColorStop(0,"#000");
    vg.addColorStop(0.7,"#1a1028");
    vg.addColorStop(1, b.phase===2 ? "#5a1030" : "#31205a");
    ctx.fillStyle=vg; ctx.beginPath(); ctx.arc(0,0,b.r*0.72,0,7); ctx.fill();
    ctx.fillStyle="#d8d2c4";
    ctx.beginPath(); ctx.ellipse(0,-4,20,24,0,0,7); ctx.fill();
    ctx.fillStyle="#0a0812";
    ctx.beginPath(); ctx.ellipse(-8,-8,5.5,7,0.2,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8,-8,5.5,7,-0.2,0,7); ctx.fill();
    ctx.fillStyle = b.phase===2 ? "#ff3050" : "#b040ff";
    ctx.beginPath(); ctx.arc(-8+ex*0.4,-8+ey*0.4,2.2,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(8+ex*0.4,-8+ey*0.4,2.2,0,7); ctx.fill();
    ctx.strokeStyle="#0a0812"; ctx.lineWidth=2;
    for(let i2=-2;i2<=2;i2++){ ctx.beginPath(); ctx.moveTo(i2*5,8); ctx.lineTo(i2*5,16+Math.abs(i2)); ctx.stroke(); }
    if(t%5===0){
      ctx.strokeStyle = b.phase===2 ? "rgba(255,60,90,0.8)" : "rgba(180,60,255,0.7)"; ctx.lineWidth=1.5;
      const a3=Math.random()*Math.PI*2;
      let xx=Math.cos(a3)*b.r*0.3, yy=Math.sin(a3)*b.r*0.3;
      ctx.beginPath(); ctx.moveTo(xx,yy);
      for(let s3=0;s3<4;s3++){ xx+=(Math.random()-0.5)*22; yy+=(Math.random()-0.5)*22; ctx.lineTo(xx,yy); }
      ctx.stroke();
    }
  }
  else if(k === 3){
    /* 双頭獣 オルトロス */
    ctx.fillStyle="#5a3226";
    ctx.beginPath(); ctx.ellipse(0,6,b.r*0.85,b.r*0.62,0,0,7); ctx.fill();
    ctx.strokeStyle="#33190f"; ctx.lineWidth=3; ctx.stroke();
    // 逆立つ毛
    ctx.strokeStyle="#4a281c"; ctx.lineWidth=2;
    for(let i2=0;i2<14;i2++){
      const ang=i2/14*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang)*b.r*0.8, 6+Math.sin(ang)*b.r*0.58);
      ctx.lineTo(Math.cos(ang)*(b.r*0.8+8+Math.sin(t*0.2+i2)*3), 6+Math.sin(ang)*(b.r*0.58+8));
      ctx.stroke();
    }
    // 爪
    ctx.strokeStyle="#d8d2c4"; ctx.lineWidth=3;
    for(const sx of [-1,1]) for(let c2=0;c2<3;c2++){
      ctx.beginPath();
      ctx.moveTo(sx*(b.r*0.45+c2*7), b.r*0.5);
      ctx.lineTo(sx*(b.r*0.45+c2*7+3), b.r*0.72);
      ctx.stroke();
    }
    // 二つの頭(顎が開閉)
    for(const sx of [-1,1]){
      const hx = sx*b.r*0.42, hy = -b.r*0.35 + Math.sin(t*0.07+sx)*4;
      ctx.fillStyle="#6a3a2a";
      ctx.beginPath(); ctx.ellipse(hx,hy,17,20,sx*0.25,0,7); ctx.fill();
      ctx.strokeStyle="#33190f"; ctx.lineWidth=2; ctx.stroke();
      const jaw = Math.abs(Math.sin(t*0.05+sx))*7;
      ctx.fillStyle="#2a0f0a";
      ctx.beginPath(); ctx.ellipse(hx, hy+11+jaw*0.4, 9, 4+jaw*0.5, 0, 0, 7); ctx.fill();
      ctx.fillStyle="#e8e0d0";
      for(let f2=-1;f2<=1;f2+=2){
        ctx.beginPath();
        ctx.moveTo(hx+f2*6, hy+8); ctx.lineTo(hx+f2*4, hy+14+jaw*0.5); ctx.lineTo(hx+f2*2, hy+8);
        ctx.fill();
      }
      ctx.fillStyle = b.phase===2 ? "#ff3030" : "#ffb02a";
      ctx.beginPath(); ctx.arc(hx-4+ex*0.4, hy-4+ey*0.4, 2.6, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(hx+4+ex*0.4, hy-4+ey*0.4, 2.6, 0, 7); ctx.fill();
    }
    if(t%12===0 && parts.length<600)
      parts.push({x:b.x+(Math.random()<0.5?-1:1)*b.r*0.42, y:b.y-b.r*0.1, vx:0, vy:1.4, life:20, col:"#b8d8b0", sz:2.6});
  }
  else{
    /* 終焉王 ラグナロク(巨大) */
    // 巨大な骨翼
    ctx.fillStyle="rgba(16,10,26,0.9)";
    for(const sx of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(sx*b.r*0.3, -10);
      for(let f2=0;f2<4;f2++){
        const wx = sx*(b.r*0.7 + f2*b.r*0.26);
        const wy = -b.r*0.5 - f2*10 + Math.sin(t*0.05+f2)*6;
        ctx.lineTo(wx, wy);
        ctx.lineTo(sx*(b.r*0.5 + f2*b.r*0.24), 10+f2*8);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = b.phase===2 ? "rgba(255,48,80,0.6)" : "rgba(160,40,220,0.5)";
    ctx.lineWidth=2; ctx.stroke();
    // 周回する残骸
    for(let i2=0;i2<10;i2++){
      const ang = t*0.015 + i2/10*Math.PI*2;
      ctx.fillStyle="#3a3242";
      ctx.fillRect(Math.cos(ang)*(b.r+14)-4, Math.sin(ang)*(b.r+14)*0.85-4, 8, 8);
    }
    // 虚無ボディ
    const vg2 = ctx.createRadialGradient(0,0,4,0,0,b.r*0.8);
    vg2.addColorStop(0,"#000"); vg2.addColorStop(0.6,"#150c22");
    vg2.addColorStop(1, b.phase===2 ? "#6a1030" : "#2a1450");
    ctx.fillStyle=vg2; ctx.beginPath(); ctx.arc(0,4,b.r*0.8,0,7); ctx.fill();
    // 角冠の巨大骸骨
    ctx.fillStyle="#d8d2c4";
    ctx.beginPath(); ctx.ellipse(0,-8,30,36,0,0,7); ctx.fill();
    ctx.strokeStyle="#8a8272"; ctx.lineWidth=2; ctx.stroke();
    ctx.strokeStyle="#b8ae98"; ctx.lineWidth=6; ctx.lineCap="round";
    for(const sx of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(sx*22,-30);
      ctx.quadraticCurveTo(sx*40,-52, sx*30,-70);
      ctx.stroke();
    }
    ctx.fillStyle="#0a0812";
    ctx.beginPath(); ctx.ellipse(-11,-14,8,10,0.15,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(11,-14,8,10,-0.15,0,7); ctx.fill();
    ctx.fillStyle = b.phase===2 ? "#ff3050" : "#b040ff";
    ctx.beginPath(); ctx.arc(-11+ex*0.5,-14+ey*0.5,3.4,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(11+ex*0.5,-14+ey*0.5,3.4,0,7); ctx.fill();
    ctx.strokeStyle="#0a0812"; ctx.lineWidth=2.5;
    for(let i2=-3;i2<=3;i2++){ ctx.beginPath(); ctx.moveTo(i2*6,10); ctx.lineTo(i2*6,22+Math.abs(i2)*1.5); ctx.stroke(); }
    // 胸の魔眼
    ctx.fillStyle="#efe6f5"; ctx.beginPath(); ctx.ellipse(0,b.r*0.42,13,9,0,0,7); ctx.fill();
    ctx.fillStyle = b.phase===2 ? "#ff3050" : "#8a30d0";
    ctx.beginPath(); ctx.arc(ex*1.2, b.r*0.42+ey*1.2, 5, 0, 7); ctx.fill();
    // 稲妻
    if(t%4===0){
      ctx.strokeStyle = b.phase===2 ? "rgba(255,60,90,0.8)" : "rgba(180,60,255,0.7)"; ctx.lineWidth=1.5;
      const a3=Math.random()*Math.PI*2;
      let xx=Math.cos(a3)*b.r*0.35, yy=Math.sin(a3)*b.r*0.35;
      ctx.beginPath(); ctx.moveTo(xx,yy);
      for(let s3=0;s3<5;s3++){ xx+=(Math.random()-0.5)*26; yy+=(Math.random()-0.5)*26; ctx.lineTo(xx,yy); }
      ctx.stroke();
    }
  }
  if(b.flash>0){
    ctx.globalAlpha = 0.35;
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.arc(0,0,b.r*0.9,0,7); ctx.fill();
    ctx.globalAlpha = b.alpha;
  }
}

function drawBoss(){
  const b = boss;
  const hid = b.def.art;
  const i = (hid === undefined) ? stage-1 : -1;
  ctx.save();
  ctx.globalAlpha = b.alpha;
  ctx.translate(b.x, b.y);

  const auraCol = b.phase===2 ? "rgba(192,57,43," : "rgba(232,163,61,";
  const pulse = 0.5+Math.sin(b.t*0.1)*0.5;
  const g = ctx.createRadialGradient(0,0,b.r*0.4,0,0,b.r+26);
  g.addColorStop(0, auraCol + (0.10+pulse*0.12) + ")");
  g.addColorStop(1, auraCol + "0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,0,b.r+26,0,7); ctx.fill();

  const fl = b.flash>0;
  const light = (c)=> fl ? "#ffb0a0" : c;

  ctx.fillStyle="rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.ellipse(0,b.r*0.75,b.r,b.r*0.28,0,0,7); ctx.fill();

  if(hid !== undefined){
    drawHiddenArt(b, hid);
  }
  else if(i===0){
    ctx.fillStyle = light("#4f3a2e"); ctx.fillRect(-42,-30,84,60);
    ctx.fillStyle = "#241c16"; ctx.fillRect(-52,-30,12,60); ctx.fillRect(40,-30,12,60);
    ctx.fillStyle="#4a3a30";
    for(let k=0;k<5;k++){ const yy=((b.t*2+k*14)%60)-30; ctx.fillRect(-51,yy,10,5); ctx.fillRect(41,yy,10,5); }
    ctx.fillStyle = light("#6a503e"); ctx.beginPath(); ctx.arc(0,-2,23,0,7); ctx.fill();
    ctx.fillStyle = "#241c16"; ctx.fillRect(-6,8,12,44);
    ctx.fillRect(-32,10,9,28); ctx.fillRect(23,10,9,28);
    ctx.fillStyle = "#c0392b"; ctx.fillRect(-14,-26,28,7);
  }
  else if(i===1){
    ctx.fillStyle = light("#3c4536"); 
    ctx.beginPath(); ctx.ellipse(0,4,20,32,0,0,7); ctx.fill();
    ctx.fillStyle = light("#2c332a"); ctx.fillRect(-8,-46,16,26);
    ctx.fillStyle = "#20261e"; ctx.fillRect(-30,18,60,9);
    ctx.fillStyle = "#c0392b"; ctx.fillRect(-30,18,8,9); ctx.fillRect(22,18,8,9);
    ctx.fillStyle = "#7fb0c0"; ctx.beginPath(); ctx.ellipse(0,20,9,11,0,0,7); ctx.fill();
    ctx.save(); ctx.rotate(b.t*0.55);
    ctx.strokeStyle="rgba(200,200,190,0.75)"; ctx.lineWidth=4;
    for(let k=0;k<3;k++){ ctx.rotate(Math.PI*2/3); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-52); ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle="rgba(220,220,210,0.25)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,52,0,7); ctx.stroke();
  }
  else if(i===2){
    ctx.fillStyle = light("#4a4438");
    ctx.beginPath();
    for(let k=0;k<6;k++){ const a=k/6*Math.PI*2+Math.PI/6; const xx=Math.cos(a)*b.r, yy=Math.sin(a)*b.r; k?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle="#2a2620"; ctx.lineWidth=4; ctx.stroke();
    for(let k=0;k<4;k++){
      const a = b.t*0.02 + k*Math.PI/2;
      const xx=Math.cos(a)*b.r*0.62, yy=Math.sin(a)*b.r*0.62;
      ctx.fillStyle="#332e26"; ctx.beginPath(); ctx.arc(xx,yy,9,0,7); ctx.fill();
      ctx.fillStyle="#1e1b16"; ctx.fillRect(xx-2,yy,4,16);
    }
    ctx.fillStyle = light("#6a5f4a"); ctx.beginPath(); ctx.arc(0,0,17,0,7); ctx.fill();
    ctx.fillStyle = "#c0392b"; ctx.beginPath(); ctx.arc(0,0,7,0,7); ctx.fill();
  }
  else if(i===3){
    ctx.strokeStyle = "#2f2a22"; ctx.lineWidth=6; ctx.lineCap="round";
    for(let k=0;k<8;k++){
      const side = k<4?-1:1;
      const mx = side*(b.r*0.8), my = -20 + (k%4)*14;
      ctx.beginPath();
      ctx.moveTo(side*16, my*0.5);
      ctx.quadraticCurveTo(mx, my-14, mx+side*16, my+Math.sin(b.t*0.12+k)*7+16);
      ctx.stroke();
    }
    ctx.fillStyle = light("#443c2e");
    ctx.beginPath(); ctx.ellipse(0,0,30,36,0,0,7); ctx.fill();
    ctx.fillStyle = light("#5d5340"); ctx.beginPath(); ctx.ellipse(0,-10,20,20,0,0,7); ctx.fill();
    ctx.fillStyle = b.phase===2 ? "#ff5040" : "#e8a33d";
    for(const ex of [-8,0,8]) { ctx.beginPath(); ctx.arc(ex,-8,3.4,0,7); ctx.fill(); }
    ctx.fillStyle="#241c16"; ctx.fillRect(-3,18,6,24);
  }
  else if(i===4){
    ctx.globalAlpha = b.alpha * (0.75 + Math.sin(b.t*0.3)*0.1);
    ctx.fillStyle = light("#23282e");
    ctx.beginPath();
    ctx.moveTo(0, 40); ctx.lineTo(-52, -22); ctx.lineTo(-14, -12);
    ctx.lineTo(0, -30); ctx.lineTo(14, -12); ctx.lineTo(52, -22);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#5a7080"; ctx.lineWidth=1.5; ctx.stroke();
    ctx.strokeStyle = "rgba(110,240,255,0.5)"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(-52,-22); ctx.lineTo(0,40); ctx.lineTo(52,-22); ctx.stroke();
    ctx.fillStyle = "#6ef0ff"; ctx.beginPath(); ctx.arc(0,12,4,0,7); ctx.fill();
  }
  else if(i===5){
    ctx.fillStyle="#241f19"; ctx.fillRect(-26,18,16,30); ctx.fillRect(10,18,16,30);
    ctx.fillStyle = light("#4a4436"); ctx.fillRect(-32,-22,64,44);
    ctx.fillStyle = light("#5f5744"); ctx.fillRect(-20,-30,40,16);
    ctx.fillStyle="#2a251e"; ctx.fillRect(-48,-26,16,22); ctx.fillRect(32,-26,16,22);
    ctx.fillStyle="#1a1712"; ctx.fillRect(-44,-4,8,16); ctx.fillRect(36,-4,8,16);
    ctx.fillStyle="#332e26"; ctx.fillRect(-9,-40,18,14);
    ctx.fillStyle = b.phase===2 ? "#ff5040" : "#6ef0ff";
    ctx.fillRect(-6,-36,12,4);
    const cg = ctx.createRadialGradient(0,0,1,0,0,10);
    cg.addColorStop(0,"#fff"); cg.addColorStop(1, b.phase===2?"#c0392b":"#e8a33d");
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0,0,9,0,7); ctx.fill();
  }
  else{
    for(const [rr, sp, cw] of [[b.r+8, 0.03, 1],[b.r-6, 0.045, -1]]){
      ctx.save(); ctx.rotate(b.t*sp*cw);
      ctx.strokeStyle = b.phase===2 ? "rgba(255,80,64,0.8)" : "rgba(232,163,61,0.8)";
      ctx.lineWidth=5;
      for(let k=0;k<4;k++){ ctx.rotate(Math.PI/2); ctx.beginPath(); ctx.arc(0,0,rr, -0.5, 0.5); ctx.stroke(); }
      ctx.restore();
    }
    ctx.fillStyle = light("#3a3542"); ctx.beginPath(); ctx.arc(0,0,b.r*0.66,0,7); ctx.fill();
    ctx.strokeStyle="#1e1a24"; ctx.lineWidth=4; ctx.stroke();
    ctx.fillStyle="#2a2632";
    for(let k=0;k<6;k++){
      const a=k/6*Math.PI*2 + b.t*0.01;
      ctx.beginPath(); ctx.arc(Math.cos(a)*b.r*0.66, Math.sin(a)*b.r*0.66, 8, 0, 7); ctx.fill();
    }
    const eg = ctx.createRadialGradient(0,0,2,0,0,b.r*0.4);
    eg.addColorStop(0,"#fff");
    eg.addColorStop(0.5, b.phase===2 ? "#ff5040" : "#d78aff");
    eg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(0,0,b.r*0.4,0,7); ctx.fill();
    ctx.fillStyle="#12101a"; ctx.beginPath(); ctx.ellipse(0,0,4,10+Math.sin(b.t*0.07)*4,0,0,7); ctx.fill();
  }
  ctx.restore();

  ctx.globalAlpha = 1;
  ctx.fillStyle="rgba(0,0,0,0.7)"; ctx.fillRect(40, 34, W-80, 14);
  ctx.fillStyle = b.phase===2 ? "#ff5040" : "#c0392b";
  ctx.fillRect(42, 36, (W-84)*Math.max(0,b.hp/b.maxhp), 10);
  ctx.strokeStyle="#d8c98f"; ctx.strokeRect(40.5,34.5,W-81,13);
  ctx.fillStyle="#d8c98f"; ctx.font="bold 12px monospace"; ctx.textAlign="left";
  ctx.fillText(b.def.name + (b.phase===2 ? " ― 第2形態" : ""), 42, 30);
  ctx.textAlign="right"; ctx.fillStyle="#8a9460";
  ctx.fillText(b.def.sub, W-42, 30);
}

function drawLaser(){
  const b = boss, L = b.laser;
  const dx = Math.sin(L.a), dy = Math.cos(L.a);
  const len = 900;
  if(L.st === "aim"){
    ctx.strokeStyle = "rgba(255,80,64," + (0.35 + Math.sin(frame*0.5)*0.2) + ")";
    ctx.lineWidth = 2;
    ctx.setLineDash([10,8]);
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x+dx*len, b.y+dy*len); ctx.stroke();
    ctx.setLineDash([]);
  }else{
    const wPulse = 16 + Math.sin(frame*0.7)*5;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = "rgba(255,120,90,0.35)"; ctx.lineWidth = wPulse*2.2;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x+dx*len, b.y+dy*len); ctx.stroke();
    ctx.strokeStyle = "rgba(255,80,64,0.85)"; ctx.lineWidth = wPulse;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x+dx*len, b.y+dy*len); ctx.stroke();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = wPulse*0.35;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x+dx*len, b.y+dy*len); ctx.stroke();
    ctx.restore();
  }
}

function drawGate(g){
  const good = g.op[0]==="+" || g.op[0]==="x";
  const col  = g.used ? "#555" : (good ? "#7da453" : "#c0392b");
  ctx.globalAlpha = g.used ? 0.35 : 0.9;
  ctx.fillStyle = "#2b2f22";
  ctx.fillRect(g.x-5, g.y, 6, g.h); ctx.fillRect(g.x+g.w-1, g.y, 6, g.h);
  ctx.fillStyle = col;
  ctx.globalAlpha = g.used ? 0.2 : 0.32;
  ctx.fillRect(g.x, g.y, g.w, g.h);
  ctx.globalAlpha = g.used ? 0.35 : 1;
  ctx.strokeStyle = col; ctx.lineWidth=2;
  ctx.strokeRect(g.x, g.y, g.w, g.h);
  const sym = (g.op[0]==="x" ? "×" : g.op[0]==="/" ? "÷" : g.op[0]) + g.op[1];
  ctx.font = "bold 26px 'Courier New',monospace"; ctx.textAlign="center";
  ctx.fillStyle = "#000"; ctx.fillText(sym, g.x+g.w/2+1, g.y+g.h/2+10);
  ctx.fillStyle = g.used ? "#888" : "#fff"; ctx.fillText(sym, g.x+g.w/2, g.y+g.h/2+9);
  ctx.globalAlpha = 1;
}

function drawCheckpoint(c){
  ctx.fillStyle = "rgba(216,201,143,0.12)";
  ctx.fillRect(0, c.y-14, W, 28);
  for(let x=18; x<W; x+=30){
    ctx.fillStyle = "#a08e5e";
    ctx.beginPath(); ctx.ellipse(x, c.y, 13, 8, 0, 0, 7); ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,0.35)"; ctx.lineWidth=1; ctx.stroke();
  }
  ctx.fillStyle="#2b2f22"; ctx.fillRect(W-40, c.y-44, 3, 44);
  ctx.fillStyle = c.done ? "#7da453" : "#e8a33d";
  ctx.beginPath(); ctx.moveTo(W-37,c.y-44); ctx.lineTo(W-12,c.y-37); ctx.lineTo(W-37,c.y-30); ctx.fill();
  ctx.font="bold 13px monospace"; ctx.textAlign="center";
  ctx.fillStyle="#d8c98f";
  ctx.fillText("― CHECKPOINT ―", W/2, c.y-20);
}

function drawHUD(){
  ctx.fillStyle="rgba(12,14,8,0.75)"; ctx.fillRect(0,0,W,30);
  ctx.strokeStyle="#3e4a2f"; ctx.beginPath(); ctx.moveTo(0,30.5); ctx.lineTo(W,30.5); ctx.stroke();
  ctx.font="bold 13px 'Courier New',monospace";
  ctx.textAlign="left"; ctx.fillStyle="#e8a33d";
  ctx.fillText("STAGE " + stage + "/" + MAX_STAGE, 10, 20);
  ctx.textAlign="center"; ctx.fillStyle="#8a9460";
  ctx.fillText("兵員 " + count, W/2-60, 20);
  ctx.fillStyle="#ffd76a";
  ctx.fillText(points + " PT", W/2+60, 20);
  ctx.textAlign="right"; ctx.fillStyle="#d8c98f";
  ctx.fillText("W:強化", W-10, 20);

  if(state==="play"||state==="boss"){
    ctx.font="11px 'Courier New',monospace"; ctx.textAlign="left";
    const lh = 15;
    const total = owned.length + items.length;
    const y0 = H - 12 - (total-1)*lh;
    ctx.fillStyle="rgba(12,14,8,0.6)";
    ctx.fillRect(4, y0-13, 186, total*lh+6);
    let row = 0;
    for(let k=0;k<owned.length;k++,row++){
      const o = owned[k];
      const wp = WEAPONS[o.id];
      ctx.fillStyle = wp.col;
      ctx.fillRect(9, y0 + row*lh - 8, 7, 7);
      ctx.fillStyle = o.lv>=5 ? "#ff8ab0" : "#c9c39f";
      ctx.fillText(wdispName(o), 21, y0 + row*lh);
      ctx.fillStyle = o.lv>=5 ? "#ff8ab0" : "#ffd76a";
      ctx.fillText("★".repeat(o.lv), 138, y0 + row*lh);
    }
    for(let k=0;k<items.length;k++,row++){
      const o = items[k];
      const it = ITEMS[o.id];
      ctx.fillStyle = it.col;
      ctx.beginPath(); ctx.arc(12.5, y0 + row*lh - 4.5, 3.8, 0, 7); ctx.fill();
      ctx.fillStyle = "#a8b8c9";
      ctx.fillText(it.name, 21, y0 + row*lh);
      ctx.fillStyle = "#8ab8ff";
      ctx.fillText("★".repeat(o.lv), 138, y0 + row*lh);
    }
  }

  if(state==="play" || state==="boss"){
    const gx = W-14, gy = 50, gh = H-160;
    ctx.fillStyle="rgba(12,14,8,0.6)"; ctx.fillRect(gx-4, gy, 8, gh);
    const ratio = Math.min(1, dist/stageLen);
    ctx.fillStyle="#e8a33d"; ctx.fillRect(gx-3, gy+gh*(1-ratio), 6, gh*ratio);
    ctx.strokeStyle="#3e4a2f"; ctx.strokeRect(gx-4.5, gy-0.5, 9, gh+1);
    ctx.font="11px monospace"; ctx.textAlign="center"; ctx.fillStyle="#c0392b";
    ctx.fillText("☠", gx, gy-6);
    ctx.fillStyle="#7da453"; ctx.fillRect(gx-6, gy+gh*0.5, 12, 2);
  }
}

/* =====================================================================
   メインループ
===================================================================== */
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
function fit(){
  const s = Math.min(innerWidth/(W+20), innerHeight/(H+20), 1.2);
  cv.style.width  = (W*s) + "px";
  cv.style.height = (H*s) + "px";
}
addEventListener("resize", fit);
fit();
showTitle();
loop();
</script>
